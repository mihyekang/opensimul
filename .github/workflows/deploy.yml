name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
      - claude/blissful-carson-akyH2
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest test_basic.py -v

      - name: Create deployment package
        run: |
          mkdir deploy
          cp app.py db.py agent_tools.py azure_openai_client.py grocery_pass1.py repl.py session_manager.py pantry_utils.py requirements.txt deploy/
          cp -r static deploy/
          cd deploy && zip -r ../deploy.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: openai-mini-poc-kmh-02
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
