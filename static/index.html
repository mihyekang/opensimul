<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영수증 분석</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: #1a1a1a; text-align: center; }
    .header-left  { display: flex; align-items: center; }
    .header-right { display: flex; justify-content: flex-end; align-items: center; }
    #header-user-code { font-size: 0.75rem; color: #888; }

    /* ── hamburger button ── */
    #hamburger-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      color: #444;
      line-height: 1;
    }
    #hamburger-btn:hover { background: #f0f0f0; }

    /* ── hamburger dropdown ── */
    #hamburger-menu {
      display: none;
      position: fixed;
      top: 54px; left: 12px;
      min-width: 196px;
      max-width: calc(100vw - 24px);
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.13);
      z-index: 1000;
      overflow: hidden;
    }
    #hamburger-menu.open { display: block; }
    .hmenu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid #f3f3f3;
      font-size: 0.88rem;
      color: #222;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: background 0.12s;
    }
    .hmenu-item:last-child { border-bottom: none; }
    .hmenu-item:hover { background: #f7f9fc; }
    .hmenu-user {
      padding: 10px 16px 8px;
      font-size: 0.78rem;
      color: #888;
      border-bottom: 1px solid #f3f3f3;
    }

    /* ── usage panel ── */
    #usage-panel {
      display: none;
      position: fixed;
      top: 54px; left: 12px;
      width: min(300px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 200;
      padding: 14px 16px;
    }
    #usage-panel.open { display: block; }
    #usage-panel h3 { font-size: 0.85rem; margin-bottom: 10px; color: #333; }
    .usage-row {
      font-size: 0.78rem;
      color: #555;
      padding: 5px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .usage-row:last-child { border-bottom: none; }




    /* ── receipt report card ── */
    .receipt-report-block {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 2px;
    }
    .receipt-report-label {
      font-size: 0.72rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .receipt-report-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .rrc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 10px;
      background: #f8fafc;
      border-bottom: 1px solid #f0f0f0;
    }
    .rrc-merchant { font-size: 0.95rem; font-weight: 700; color: #111; }
    .rrc-date { font-size: 0.75rem; color: #888; }
    .rrc-items { padding: 8px 14px; }
    .rrc-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 4px 0;
      color: #444;
      border-bottom: 1px solid #f8f8f8;
    }
    .rrc-item:last-child { border-bottom: none; }
    .rrc-item.discount { color: #dc2626; }
    .rrc-item.more { color: #aaa; font-size: 0.78rem; }
    .rrc-sub-header {
      font-size: 0.72rem;
      font-weight: 600;
      color: #888;
      padding: 8px 14px 2px;
      letter-spacing: 0.02em;
      border-top: 1px solid #f0f0f0;
    }
    .rrc-sub-header:first-of-type { border-top: none; }
    .rrc-subtotal {
      display: flex;
      justify-content: space-between;
      padding: 6px 14px 8px;
      font-size: 0.8rem;
      color: #555;
      background: #fafafa;
    }
    .rrc-total {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f8fafc;
      border-top: 1px solid #f0f0f0;
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* ── receipt delete block ── */
    .receipt-delete-block {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 2px;
    }
    .receipt-delete-label {
      font-size: 0.72rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .receipt-delete-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: opacity 0.3s;
    }
    .receipt-delete-card.deleted { opacity: 0.35; background: #f9fafb; }
    .rdc-id {
      font-size: 0.72rem;
      color: #bbb;
      font-weight: 600;
      min-width: 34px;
      text-align: center;
    }
    .rdc-info { flex: 1; min-width: 0; }
    .rdc-merchant { font-size: 0.88rem; font-weight: 700; color: #111; }
    .rdc-meta { font-size: 0.73rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rdc-del-btn {
      padding: 6px 11px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
      font-family: inherit;
    }
    .rdc-del-btn:hover:not(:disabled) { background: #fecaca; }
    .rdc-del-btn:disabled { background: #f3f4f6; color: #ccc; border-color: #e5e7eb; cursor: default; }

    /* ── overlay hamburger button (visible inside full-screen overlays) ── */
    .overlay-hamburger-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      color: #444;
      line-height: 1;
      flex-shrink: 0;
    }
    .overlay-hamburger-btn:hover { background: #f0f0f0; }

    /* ── receipt history overlay ── */
    #history-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f6f8;
      z-index: 500;
      flex-direction: column;
    }
    #history-overlay.open { display: flex; }
    .history-header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .history-title { flex: 1; font-size: 1rem; font-weight: 700; color: #111; }
    .history-add-btn {
      padding: 7px 12px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .history-add-btn:hover { background: #106ebe; }
    .history-del-toggle {
      padding: 7px 10px;
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      font-family: inherit;
    }
    .history-del-toggle.active { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .history-del-confirm {
      display: none;
      padding: 7px 12px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .history-del-confirm.visible { display: block; }
    .history-sel-all {
      display: none;
      padding: 7px 10px;
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .history-sel-all.visible { display: block; }
    .history-sel-all.all-selected { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .history-close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #666;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .history-close-btn:hover { background: #f0f0f0; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      width: 100%;
      align-self: center;
    }
    .history-empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 0.88rem; line-height: 1.8; }
    .hrc {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: border-color 0.15s;
      flex-shrink: 0;   /* prevent flex compression when list overflows */
    }
    .hrc.checked { border-color: #0078d4; background: #f0f7ff; }
    .hrc-row {
      display: flex;
      align-items: flex-start;
      padding: 12px 14px;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .hrc-row:hover { background: #fafafa; }
    .hrc.checked .hrc-row { background: transparent; }
    .hrc-check {
      display: none;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #ccc;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: transparent;
      transition: all 0.15s;
    }
    .delete-mode .hrc-check { display: flex; }
    .hrc.checked .hrc-check { background: #0078d4; border-color: #0078d4; color: #fff; }
    .hrc-icon { font-size: 1.2rem; flex-shrink: 0; padding-top: 1px; }
    .hrc-body { flex: 1; min-width: 0; }
    .hrc-merchant { font-size: 0.9rem; font-weight: 700; color: #111; word-break: keep-all; }
    .hrc-meta { font-size: 0.73rem; color: #888; margin-top: 3px; }
    .hrc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .hrc-amount { font-size: 0.88rem; font-weight: 700; color: #111; white-space: nowrap; }
    .hrc-expand { font-size: 0.68rem; color: #bbb; transition: transform 0.2s; line-height: 1; }
    .hrc.expanded .hrc-expand { transform: rotate(180deg); }
    .hrc-detail {
      max-height: 0;
      overflow: hidden;
      background: #fafafa;
      transition: max-height 0.35s ease;
    }
    .hrc.expanded .hrc-detail {
      max-height: 1500px;
      overflow-y: auto;
      border-top: 1px solid #f0f0f0;
      padding: 10px 14px 14px;
    }
    .hrc-items-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .hrc-items-table td { padding: 5px 4px; border-bottom: 1px solid #f0f0f0; color: #333; }
    .hrc-items-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hrc-items-table tr:last-child td { border-bottom: none; }
    .hrc-items-table tr.cancelled td { color: #bbb; text-decoration: line-through; }
    .hrc-items-table tr.discount td { color: #dc2626; }
    .hrc-total-row {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid #e5e7eb;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ── chat area ── */
    #chat-wrap {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .bubble-row.user      { align-self: flex-end;   align-items: flex-end; }
    .bubble-row.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .user .bubble {
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .assistant .bubble.streaming { white-space: pre-wrap; }
    .tool-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82em;
      color: #6b7280;
      font-style: italic;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* image in user bubble */
    .bubble-img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
      object-fit: cover;
    }

    /* ── markdown styles ── */
    .assistant .bubble h1,
    .assistant .bubble h2,
    .assistant .bubble h3,
    .assistant .bubble h4 {
      margin: 0.9em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .assistant .bubble h1 { font-size: 1.25em; }
    .assistant .bubble h2 { font-size: 1.1em; }
    .assistant .bubble h3 { font-size: 1em; }
    .assistant .bubble p { margin: 0.5em 0; }
    .assistant .bubble p:first-child { margin-top: 0; }
    .assistant .bubble p:last-child  { margin-bottom: 0; }
    .assistant .bubble ul,
    .assistant .bubble ol { margin: 0.5em 0 0.5em 1.4em; }
    .assistant .bubble li { margin: 0.2em 0; }
    .assistant .bubble blockquote {
      border-left: 3px solid #0078d4;
      margin: 0.6em 0;
      padding: 4px 12px;
      color: #555;
      background: #f7f9fc;
      border-radius: 0 6px 6px 0;
    }
    .assistant .bubble a { color: #0078d4; text-decoration: underline; }
    .assistant .bubble code {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85em;
    }
    .assistant .bubble pre {
      margin: 0.6em 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    .assistant .bubble pre code {
      display: block;
      padding: 12px 14px;
      overflow-x: auto;
      background: #f6f8fa;
      border: none;
      border-radius: 0;
      font-size: 0.83em;
      line-height: 1.55;
    }
    .assistant .bubble table {
      border-collapse: collapse;
      margin: 0.6em 0;
      font-size: 0.85em;
      width: 100%;
    }
    .assistant .bubble th,
    .assistant .bubble td {
      border: 1px solid #dde1e7;
      padding: 6px 10px;
      text-align: left;
    }
    .assistant .bubble th { background: #f3f4f6; font-weight: 600; }
    .assistant .bubble tr:nth-child(even) td { background: #fafafa; }
    .assistant .bubble hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 0.8em 0;
    }

    /* ── cursor ── */
    .typing-cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .usage-tag {
      font-size: 0.68rem;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ── footer / input ── */
    footer {
      width: 100%;
      max-width: 800px;
      padding: 8px 16px 20px;
    }

    /* image preview strip above input */
    #img-preview-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      padding: 6px 10px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
    }
    #img-preview-wrap.visible { display: flex; }
    #img-preview {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    #img-preview-name {
      flex: 1;
      font-size: 0.78rem;
      color: #555;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #img-remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #999;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #img-remove-btn:hover { background: #f0f0f0; color: #333; }

    .input-row {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.9rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      background: transparent;
    }

    #img-btn {
      align-self: flex-end;
      padding: 7px 10px;
      background: none;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      color: #555;
      transition: background 0.15s;
      line-height: 1;
    }
    #img-btn:hover { background: #f0f0f0; }

    #send-btn {
      align-self: flex-end;
      padding: 7px 16px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #106ebe; }
    #send-btn:disabled { background: #b0c8e8; cursor: not-allowed; }

    /* DB 저장 뱃지 */
    .saved-badge {
      font-size: 0.65rem;
      color: #0078d4;
      margin-top: 2px;
      padding: 0 4px;
    }

    /* filter bar */
    .history-filter-bar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .history-filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hfc {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
      font-family: inherit;
    }
    .hfc.active { border-color: #0078d4; background: #e8f3fc; color: #0078d4; }
    .history-filter-stat {
      font-size: 0.78rem;
      color: #888;
      padding: 2px 4px;
    }
    .history-filter-stat strong { color: #111; }

    /* weekly overlay */
    #weekly-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f6f8;
      z-index: 500;
      flex-direction: column;
    }
    #weekly-overlay.open { display: flex; }
    .weekly-header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .weekly-title { flex: 1; font-size: 1rem; font-weight: 700; color: #111; }
    .weekly-export-btn {
      padding: 5px 11px;
      background: #f3f4f6;
      color: #374151;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .weekly-export-btn:hover { background: #e5e7eb; border-color: #9ca3af; }
    .weekly-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      width: 100%;
      align-self: center;
    }
    .week-card {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .week-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .week-label { font-size: 0.82rem; color: #888; font-weight: 600; }
    .week-total { font-size: 1.1rem; font-weight: 800; color: #111; }
    .week-empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 0.88rem; }

    /* weekly date bar */
    .weekly-date-bar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .weekly-date-label { font-size: 0.78rem; color: #666; font-weight: 600; white-space: nowrap; }
    .weekly-date-sep { font-size: 0.82rem; color: #aaa; }
    .weekly-date-bar input[type="date"] {
      flex: 1;
      min-width: 0;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
    }
    .weekly-date-bar input[type="date"]:focus { border-color: #0078d4; }
    .weekly-apply-btn {
      padding: 6px 14px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .weekly-apply-btn:hover { background: #106ebe; }

    /* stacked bar + merchant list */
    .week-stacked-bar {
      height: 14px;
      border-radius: 7px;
      display: flex;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .week-stacked-segment { height: 100%; transition: width 0.4s ease; }
    .week-merchants { display: flex; flex-direction: column; gap: 2px; }
    .week-merchant-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .week-merchant-row:last-child { border-bottom: none; }
    .week-merchant-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .week-merchant-name {
      flex: 1;
      color: #333;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 2px;
    }
    .week-merchant-name:hover { color: #0078d4; }
    .week-merchant-amt { font-size: 0.8rem; color: #555; white-space: nowrap; }

    /* edit buttons */
    /* ── receipt edit modal ── */
    .edit-modal { background:#fff; border-radius:18px; padding:22px; width:min(94vw,500px); box-shadow:0 8px 32px rgba(0,0,0,.18); }
    .edit-modal-title { font-size:1rem; font-weight:700; color:#111; margin-bottom:14px; }
    .edit-meta-section { display:flex; gap:10px; margin-bottom:14px; }
    .edit-field { display:flex; flex-direction:column; flex:1; }
    .edit-label { font-size:0.75rem; color:#555; font-weight:700; margin-bottom:4px; }
    .edit-input { padding:8px; border:1px solid #e0e0e0; border-radius:8px; font-size:0.88rem; font-family:inherit; outline:none; }
    .edit-input:focus { border-color:#0078d4; }
    .edit-items-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .edit-items-hint { font-size:0.72rem; color:#aaa; }
    .edit-items-list { display:flex; flex-direction:column; gap:5px; margin-bottom:8px; max-height:300px; overflow-y:auto; }
    .edit-item-row { display:grid; grid-template-columns:28px 28px 1fr 52px 80px; gap:5px; align-items:center; }
    .edit-item-add, .edit-item-del {
      width:26px; height:26px; border-radius:50%; background:none;
      cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; line-height:1;
      font-size:1rem; font-weight:700;
    }
    .edit-item-add { border:1.5px solid #86efac; color:#16a34a; }
    .edit-item-add:hover { background:#dcfce7; }
    .edit-item-del { border:1.5px solid #fca5a5; color:#dc2626; }
    .edit-item-del:hover { background:#fee2e2; }
    .edit-item-name, .edit-item-qty, .edit-item-amount {
      padding:6px 7px; border:1px solid #e5e7eb; border-radius:6px;
      font-size:0.82rem; font-family:inherit; outline:none; width:100%;
    }
    .edit-item-qty   { text-align:center; }
    .edit-item-amount { text-align:right; }
    .edit-item-name:focus, .edit-item-qty:focus, .edit-item-amount:focus { border-color:#0078d4; }
    .edit-item-row.deleted { opacity:0.35; pointer-events:none; }
    .edit-add-item-btn {
      width:100%; padding:8px; border:1.5px dashed #0078d4; border-radius:8px;
      background:none; color:#0078d4; font-size:0.82rem; font-weight:600;
      cursor:pointer; font-family:inherit; margin-bottom:14px;
    }
    .edit-add-item-btn:hover { background:#e8f3fc; }
    .edit-actions { display:flex; gap:8px; }
    .edit-cancel-btn { flex:1; padding:10px; border:1px solid #e0e0e0; border-radius:8px; background:#fff; color:#555; font-weight:600; cursor:pointer; font-family:inherit; }
    .edit-save-btn { flex:2; padding:10px; border:none; border-radius:8px; background:#0078d4; color:#fff; font-weight:600; cursor:pointer; font-family:inherit; }
    .edit-save-btn:hover { background:#106ebe; }

    .hrc-del-btn {
      padding: 4px 10px;
      background: none;
      border: 1.5px solid #fca5a5;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #dc2626;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .hrc-del-btn:hover { background: #fee2e2; }
    .hrc-edit-btn {
      padding: 4px 8px;
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.72rem;
      color: #0078d4;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s;
    }
    .hrc-edit-btn:hover { background: #e8f3fc; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <button id="hamburger-btn" title="메뉴">☰</button>
  </div>
  <h1>영수증 분석</h1>
  <div class="header-right"><span id="header-user-code"></span></div>
</header>

<!-- hamburger dropdown -->
<div id="hamburger-menu">
  <a href="/chat" class="hmenu-item">대화하기</a>
  <a href="/grocery" class="hmenu-item">영수증 분석기</a>
  <button id="history-btn" class="hmenu-item">영수증 이력</button>
  <button id="weekly-btn" class="hmenu-item">주간 지출 분석</button>
  <a href="/pantry" class="hmenu-item">재고 관리</a>
  <button id="reset-btn" class="hmenu-item">대화 초기화</button>
  <button id="usage-btn" class="hmenu-item">사용량 확인</button>
  <button id="logout-btn" class="hmenu-item" style="color:#dc2626;">로그아웃</button>
</div>

<!-- usage panel -->
<div id="usage-panel">
  <h3>📊 사용량 정보</h3>
  <div class="usage-row"><span id="deployment-label">—</span></div>
  <div class="usage-row"><span id="rate-label">—</span></div>
  <div class="usage-row"><span id="cost-label">누적: —</span></div>
  <div class="usage-row"><span id="turns-label">—</span></div>
</div>


<div id="chat-wrap"></div>

<footer>
  <div id="img-preview-wrap">
    <img id="img-preview" src="" alt="preview" />
    <span id="img-preview-name"></span>
    <button id="img-remove-btn" title="이미지 제거">✕</button>
  </div>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요… (이미지 분석 시 설명을 추가할 수 있어요)"></textarea>
    <button id="img-btn" title="이미지 업로드">🖼</button>
    <button id="send-btn">전송</button>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none" />
</footer>

<!-- receipt edit modal -->
<div id="receipt-edit-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 0;">
  <div class="edit-modal">
    <p class="edit-modal-title">영수증 수정</p>
    <div class="edit-meta-section">
      <div class="edit-field">
        <label class="edit-label">업체</label>
        <input id="edit-merchant" type="text" class="edit-input" placeholder="예: 이마트" />
      </div>
      <div class="edit-field">
        <label class="edit-label">구매일</label>
        <input id="edit-date" type="date" class="edit-input" />
      </div>
    </div>
    <div class="edit-items-header">
      <span class="edit-label">구매 항목</span>
      <span class="edit-items-hint">품목명 · 수량 · 금액</span>
    </div>
    <div id="edit-items-list" class="edit-items-list"></div>
    <button id="edit-add-item" class="edit-add-item-btn">+ 항목 추가</button>
    <div class="edit-actions">
      <button id="edit-cancel" class="edit-cancel-btn">취소</button>
      <button id="edit-save" class="edit-save-btn">저장</button>
    </div>
  </div>
</div>

<!-- receipt history overlay -->
<div id="history-overlay">
  <div class="history-header">
    <button class="overlay-hamburger-btn" id="history-hamburger-btn" title="메뉴">☰</button>
    <span class="history-title">영수증 이력</span>
    <a href="/grocery" class="history-add-btn">＋ 추가</a>
    <button id="history-del-toggle" class="history-del-toggle">🗑 삭제</button>
    <button id="history-sel-all" class="history-sel-all">전체 선택</button>
    <button id="history-del-confirm" class="history-del-confirm">선택 삭제 (0)</button>
    <button id="history-close-btn" class="history-close-btn" title="닫기">✕</button>
  </div>
  <div class="weekly-date-bar" id="history-date-bar">
    <span class="weekly-date-label">기간</span>
    <input type="date" id="history-start-date" />
    <span class="weekly-date-sep">~</span>
    <input type="date" id="history-end-date" />
    <button id="history-apply-btn" class="weekly-apply-btn">조회</button>
  </div>
  <div id="history-filter-bar" class="history-filter-bar" style="display:none"></div>
  <div id="history-list" class="history-list"></div>
</div>

<!-- weekly overlay -->
<div id="weekly-overlay">
  <div class="weekly-header">
    <button class="overlay-hamburger-btn" id="weekly-hamburger-btn" title="메뉴">☰</button>
    <span class="weekly-title">주간 지출</span>
    <button id="weekly-export-html-btn" class="weekly-export-btn" title="HTML 파일로 저장">HTML</button>
    <button id="weekly-export-pdf-btn" class="weekly-export-btn" title="PDF로 저장 (인쇄)">PDF</button>
    <button id="weekly-close-btn" class="history-close-btn" title="닫기">✕</button>
  </div>
  <div class="weekly-date-bar">
    <span class="weekly-date-label">기간</span>
    <input type="date" id="weekly-start-date" />
    <span class="weekly-date-sep">~</span>
    <input type="date" id="weekly-end-date" />
    <button id="weekly-apply-btn" class="weekly-apply-btn">조회</button>
  </div>
  <div id="weekly-content" class="weekly-content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // ── auth guard ──
  const _authCode = localStorage.getItem("grocery_user_code");
  if (!_authCode) { window.location.replace("/grocery"); }
  const USER_CODE = _authCode || "";

  marked.setOptions({
    highlight: (code, lang) => {
      const language = hljs.getLanguage(lang) ? lang : "plaintext";
      return hljs.highlight(code, { language }).value;
    },
    breaks: true,
    gfm: true,
  });

  const chatWrap      = document.getElementById("chat-wrap");
  const inputEl       = document.getElementById("input");
  const sendBtn       = document.getElementById("send-btn");
  const imgBtn        = document.getElementById("img-btn");
  const fileInput     = document.getElementById("file-input");
  const previewWrap   = document.getElementById("img-preview-wrap");
  const previewImg    = document.getElementById("img-preview");
  const previewName   = document.getElementById("img-preview-name");
  const imgRemoveBtn  = document.getElementById("img-remove-btn");
  const hamburgerBtn  = document.getElementById("hamburger-btn");
  const hamburgerMenu = document.getElementById("hamburger-menu");
  const usagePanel    = document.getElementById("usage-panel");
  const usageBtn      = document.getElementById("usage-btn");

  let streaming    = false;
  let pendingImage = null;

  // ── image picker ──
  imgBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    pendingImage = file;
    previewImg.src = URL.createObjectURL(file);
    previewName.textContent = file.name;
    previewWrap.classList.add("visible");
    fileInput.value = "";
  });
  imgRemoveBtn.addEventListener("click", clearImage);

  function clearImage() {
    pendingImage = null;
    previewImg.src = "";
    previewWrap.classList.remove("visible");
  }

  // ── textarea ──
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);

  // ── session ──
  function getSessionId() {
    let sid = localStorage.getItem("chat_session_id");
    if (!sid) {
      sid = crypto.randomUUID();
      localStorage.setItem("chat_session_id", sid);
    }
    return sid;
  }
  const SESSION_ID = getSessionId();
  document.getElementById("header-user-code").textContent = USER_CODE;

  // ── info ──
  async function loadInfo() {
    const d = await fetch(`/info?session_id=${SESSION_ID}`).then(r => r.json());
    document.getElementById("deployment-label").textContent = `모델: ${d.deployment}`;
    document.getElementById("rate-label").textContent =
      `환율: 1 USD = ₩${d.usd_to_krw.toLocaleString("ko-KR", { maximumFractionDigits: 1 })} (${d.rate_date})`;
    updateCostLabel(d.total_cost_usd, d.total_cost_krw, d.total_tokens);
    updateTurnsLabel(d.current_turns, d.max_history_turns);
  }

  function updateCostLabel(usd, krw, tokens) {
    document.getElementById("cost-label").textContent =
      `누적: $${usd.toFixed(6)} (₩${krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}) · ${tokens} tokens`;
  }

  function updateTurnsLabel(cur, max) {
    const el = document.getElementById("turns-label");
    const pct = max > 0 ? cur / max : 0;
    const color = pct >= 0.9 ? "#e00" : pct >= 0.7 ? "#f90" : "#888";
    el.innerHTML = `<span style="color:${color}">대화: ${cur}/${max}</span>`;
  }

  // ── hamburger + panel management ──
  function closeAllPanels() {
    hamburgerMenu.classList.remove("open");
    usagePanel.classList.remove("open");
  }

  function toggleHamburger(e) {
    e.stopPropagation();
    const wasOpen = hamburgerMenu.classList.contains("open");
    closeAllPanels();
    if (!wasOpen) hamburgerMenu.classList.add("open");
  }

  hamburgerBtn.addEventListener("click", toggleHamburger);
  document.getElementById("history-hamburger-btn").addEventListener("click", toggleHamburger);
  document.getElementById("weekly-hamburger-btn").addEventListener("click", toggleHamburger);

  usageBtn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = usagePanel.classList.contains("open");
    closeAllPanels();
    if (!wasOpen) { usagePanel.classList.add("open"); loadInfo(); }
  });

  document.getElementById("reset-btn").addEventListener("click", e => {
    e.stopPropagation();
    closeAllPanels();
    resetChat();
  });

  document.getElementById("logout-btn").addEventListener("click", e => {
    e.stopPropagation();
    localStorage.removeItem("grocery_user_code");
    window.location.href = "/grocery";
  });

  // history 날짜 바 초기값
  (function() {
    const today = new Date().toISOString().slice(0, 10);
    const ago30 = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
    document.getElementById("history-start-date").value = ago30;
    document.getElementById("history-end-date").value   = today;
  })();

  document.getElementById("history-apply-btn").addEventListener("click", () => {
    const s = document.getElementById("history-start-date").value;
    const e = document.getElementById("history-end-date").value;
    if (s && e) openHistoryPanel(null, s, e);
  });

  document.getElementById("history-btn").addEventListener("click", e => {
    e.stopPropagation();
    closeAllPanels();
    const s = document.getElementById("history-start-date").value;
    const en = document.getElementById("history-end-date").value;
    openHistoryPanel(null, s || null, en || null);
  });

  // 패널 내부 클릭은 전파 차단
  hamburgerMenu.addEventListener("click", e => e.stopPropagation());
  usagePanel.addEventListener("click",    e => e.stopPropagation());

  // 외부 클릭 시 모두 닫기
  document.addEventListener("click", closeAllPanels);

  // ── bubble helpers ──
  function addBubble(role, text = "") {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user" && text) bubble.textContent = text;
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return { row, bubble };
  }

  function renderMarkdown(bubble, raw) {
    bubble.classList.remove("streaming", "typing-cursor");
    bubble.innerHTML = marked.parse(raw);
    bubble.querySelectorAll("pre code:not(.hljs)").forEach(el => hljs.highlightElement(el));
  }

  function appendUsageTag(row, u) {
    const tag = document.createElement("div");
    tag.className = "usage-tag";
    tag.textContent =
      `${u.prompt_tokens} in / ${u.completion_tokens} out · ` +
      `$${u.turn_cost_usd.toFixed(6)} (₩${u.turn_cost_krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
    row.appendChild(tag);
    if (u.total_cost_usd !== undefined) {
      updateCostLabel(u.total_cost_usd, u.total_cost_krw, u.total_tokens);
    }
    // turns 카운터 갱신
    fetch("/info").then(r => r.json()).then(d => updateTurnsLabel(d.current_turns, d.max_history_turns));
  }

  // ── send dispatcher ──
  const RECEIPT_DELETE_RE = new RegExp(
    "잘못\\s*(올렸|저장|업로드)" +
    "|중복.*올렸|올렸.*중복|중복.*저장|중복.*됐|중복이야" +
    "|삭제\\s*(하고|할|하려|해줘|해|하|해달|하자|할게|할래)" +
    "|(영수증|구매).*(삭제|지우|없애)" +
    "|(삭제|지우|없애).*(영수증|구매)"
  );

  const RECEIPT_RENDER_RE = new RegExp(
    "렌더링|시각화" +
    "|카드\\s*(뉴스|이미지|형태|로\\s*(보여|만들|정리|해))" +
    "|이미지로\\s*(보여|만들)" +
    "|예쁘게\\s*(보여|정리|만들|요약|표현|해)" +
    "|보기좋게|이쁘게" +
    "|카드로?\\s*(보여|만들|정리|요약)" +
    "|(영수증|구매)\\s*.*(보여|정리|카드|요약|시각)"
  );

  const SESSION_RECEIPT_SUMMARY_RE = new RegExp(
    "(현재|지금|오늘|세션|이번).*(저장|등록|가져온|올린).*(영수증|내역|구매)" +
    "|(저장|등록|가져온|올린).*(영수증|내역).*(알려|보여|요약)" +
    "|현재까지.*영수증|영수증.*내역.*알려줘"
  );

  async function showSessionReceiptSummary(msg) {
    const receipts = _getSessionReceipts();
    const { row: uRow, bubble: uBubble } = addBubble("user");
    uBubble.textContent = msg;
    inputEl.value = "";

    if (receipts.length === 0) {
      const { bubble: aBubble } = addBubble("assistant");
      aBubble.textContent = "이 세션에서 저장된 영수증이 없어요. 영수증 분석기에서 영수증을 업로드하면 여기서 확인할 수 있어요.";
      return;
    }

    renderReceiptsIntoChat(receipts);

    const _summary = receipts.map(r => {
      const items = (r.items||[]).filter(i=>!i.is_cancelled && i.amount != null && i.amount > 0);
      const totalLine = r.total ? ` (합계 ${r.total.toLocaleString("ko-KR")}원)` : "";
      return `[${r.merchant||"알 수 없음"} · ${r.purchase_date||"날짜 미상"}] ${items.length}건${totalLine}`;
    }).join("\n");

    const totalAmt = receipts.reduce((s, r) => s + (r.total || 0), 0);
    const prompt = `[이 세션에서 저장한 영수증 ${receipts.length}건]\n${_summary}\n합계: ${totalAmt.toLocaleString("ko-KR")}원\n\n간단히 요약해줘.`;
    await sendText(prompt);
  }

  // ── text chat ──
  async function sendText(msg) {
    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addBubble("user", msg);
    const { row: aRow, bubble: aBubble } = addBubble("assistant");
    aBubble.classList.add("streaming", "typing-cursor");

    try {
      await sendStreaming(msg, aRow, aBubble);
    } catch {
      aBubble.textContent = "";
      try {
        await sendFallback(msg, aRow, aBubble);
      } catch (err) {
        aBubble.classList.remove("streaming", "typing-cursor");
        aBubble.textContent = `오류: ${err.message}`;
      }
    }

    aBubble.classList.remove("streaming", "typing-cursor");
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  async function sendStreaming(msg, aRow, aBubble) {
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, session_id: SESSION_ID, user_id: USER_CODE }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", rawText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));
        if (payload.tool_call !== undefined) {
          const toolNames = {
            query_spending_by_period: "기간별 지출 조회",
            query_spending_by_merchant: "업체별 지출 조회",
            search_items: "품목 검색",
            get_spending_summary: "지출 요약 집계",
          };
          const label = toolNames[payload.tool_call] || payload.tool_call;
          aBubble.innerHTML = `<span class="tool-status">🔍 ${label} 중...</span>`;
          rawText = "";
        }
        if (payload.token !== undefined) {
          rawText += payload.token;
          aBubble.textContent = rawText;
          chatWrap.scrollTop = chatWrap.scrollHeight;
        }
        if (payload.done) {
          renderMarkdown(aBubble, rawText);
          chatWrap.scrollTop = chatWrap.scrollHeight;
          appendUsageTag(aRow, payload.usage);
        }
      }
    }
    renderMarkdown(aBubble, rawText);
  }

  async function sendFallback(msg, aRow, aBubble) {

  // ── receipt card helpers (모듈 스코프, grocery_saved + showReceiptCards 공유) ──
  function _rcptFmt(n) {
    if (n == null) return "—";
    const s = Math.abs(n).toLocaleString("ko-KR") + "원";
    return n < 0 ? "−" + s : s;
  }
  function _rcptEsc(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function _groupByMerchant(receipts) {
    const map = {}, order = [];
    receipts.forEach(r => {
      const key = r.merchant || "알 수 없음";
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(r);
    });
    return order.map(k => ({ merchant: k, receipts: map[k] }));
  }
  function _buildMerchantCard(merchant, receipts) {
    const MAX = 5;
    const multiVisit = receipts.length > 1;
    const grandTotal = receipts.reduce((sum, r) => sum + (r.total || 0), 0);

    const card = document.createElement("div");
    card.className = "receipt-report-card";
    const headerDate = multiVisit
      ? `${receipts.length}회 방문`
      : (receipts[0].purchase_date || "날짜 미상") + (receipts[0]._date_inferred ? " *" : "");
    card.innerHTML = `<div class="rrc-header">
        <span class="rrc-merchant">🏪 ${_rcptEsc(merchant)}</span>
        <span class="rrc-date">${_rcptEsc(headerDate)}</span>
      </div>`;

    receipts.forEach((r, idx) => {
      const allItems  = r.items || [];
      const purchase  = allItems.filter(i => !i.is_cancelled && i.amount != null && i.amount > 0);
      const discounts = allItems.filter(i => !i.is_cancelled && i.amount != null && i.amount < 0);
      const discTotal = discounts.reduce((s,i) => s+i.amount, 0);
      const visitTotal = r.total != null ? r.total
        : allItems.filter(i => !i.is_cancelled && i.amount != null).reduce((s,i) => s+i.amount, 0);

      if (multiVisit) {
        const sh = document.createElement("div");
        sh.className = "rrc-sub-header";
        sh.textContent = (r.purchase_date || `방문 ${idx+1}`) + (r._date_inferred ? " *" : "");
        card.appendChild(sh);
      }
      const itemsDiv = document.createElement("div");
      itemsDiv.className = "rrc-items";
      purchase.slice(0, MAX).forEach(i => {
        const row = document.createElement("div");
        row.className = "rrc-item";
        row.innerHTML = `<span>${_rcptEsc(i.raw_name)}</span><span>${_rcptFmt(i.amount)}</span>`;
        itemsDiv.appendChild(row);
      });
      if (purchase.length > MAX) {
        const more = document.createElement("div");
        more.className = "rrc-item more";
        more.innerHTML = `<span>외 ${purchase.length - MAX}개 품목</span><span></span>`;
        itemsDiv.appendChild(more);
      }
      if (discTotal < 0) {
        const disc = document.createElement("div");
        disc.className = "rrc-item discount";
        disc.innerHTML = `<span>↳ 할인</span><span>${_rcptFmt(discTotal)}</span>`;
        itemsDiv.appendChild(disc);
      }
      card.appendChild(itemsDiv);
      if (multiVisit) {
        const st = document.createElement("div");
        st.className = "rrc-subtotal";
        st.innerHTML = `<span>소계</span><span>${_rcptFmt(visitTotal)}</span>`;
        card.appendChild(st);
      }
    });

    const tot = document.createElement("div");
    tot.className = "rrc-total";
    tot.innerHTML = `<span>${multiVisit ? "총합계" : "합계"}</span><span>${_rcptFmt(grandTotal)}</span>`;
    card.appendChild(tot);
    return card;
  }
  function renderReceiptsIntoChat(receipts, label) {
    const groups = _groupByMerchant(receipts);
    const block = document.createElement("div");
    block.className = "receipt-report-block";
    const lbl = document.createElement("p");
    lbl.className = "receipt-report-label";
    lbl.textContent = label || (groups.length < receipts.length
      ? `🧾 저장된 영수증 ${receipts.length}장 · ${groups.length}개 업체`
      : `🧾 저장된 영수증 ${receipts.length}장`);
    block.appendChild(lbl);
    groups.forEach(g => block.appendChild(_buildMerchantCard(g.merchant, g.receipts)));
    chatWrap.appendChild(block);
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

  document.getElementById("edit-save").addEventListener("click", async () => {
    const merchant = document.getElementById("edit-merchant").value.trim();
    const date     = document.getElementById("edit-date").value;
    if (!merchant || !date) { alert("업체와 날짜를 입력해주세요."); return; }

    const saveBtn = document.getElementById("edit-save");
    saveBtn.disabled = true;
    saveBtn.textContent = "저장 중…";

    try {
      const list = document.getElementById("edit-items-list");
      const rows = [...list.querySelectorAll(".edit-item-row")];

      // 1. 메타 수정 (합계는 남은 품목 금액 합산)
      const newTotal = rows.reduce((sum, row) => {
        const amt = parseInt(row.querySelector(".edit-item-amount").value) || 0;
        return sum + (amt > 0 ? amt : 0);
      }, 0);
      await fetch(`/grocery/receipt/${_editingReceiptId}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ merchant, purchase_date: date, total: newTotal || null, user_id: USER_CODE }),
      });

      // 2. 삭제된 품목
      for (const id of _editDeletedIds) {
        await fetch(`/grocery/item/${id}?user_id=${encodeURIComponent(USER_CODE)}`, { method: "DELETE" });
      }

      // 3. 기존 품목 수정 / 신규 품목 추가
      for (const row of rows) {
        const id      = row.dataset.itemId;
        const rawName = row.querySelector(".edit-item-name").value.trim();
        const qty     = parseInt(row.querySelector(".edit-item-qty").value) || 1;
        const amount  = parseInt(row.querySelector(".edit-item-amount").value) || null;
        if (!rawName) continue;

        if (String(id).startsWith("new-")) {
          await fetch(`/grocery/receipt/${_editingReceiptId}/item`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ raw_name: rawName, qty, amount, user_id: USER_CODE }),
          });
        } else {
          await fetch(`/grocery/item/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ raw_name: rawName, qty, amount, user_id: USER_CODE }),
          });
        }
      }

      document.getElementById("receipt-edit-overlay").style.display = "none";
      await openHistoryPanel();
    } catch (err) {
      alert("오류: " + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "저장";
    }
  });

  function _renderFilterBar(rows, initialFilter = null) {
    const bar = document.getElementById("history-filter-bar");
    if (!rows || rows.length === 0) { bar.style.display = "none"; return; }

    // gather merchants
    const merchants = ["전체", ...new Set(rows.map(r => r.merchant || "알 수 없음"))];
    let activeMerchant = "전체";

    const chipsEl = document.createElement("div");
    chipsEl.className = "history-filter-chips";
    const statEl = document.createElement("div");
    statEl.className = "history-filter-stat";

    function updateStat(m) {
      const filtered = m === "전체" ? rows : rows.filter(r => (r.merchant || "알 수 없음") === m);
      const total = filtered.reduce((s, r) => s + (r.total || 0), 0);
      const count = filtered.length;
      statEl.innerHTML = `<strong>${count}건</strong> · 합계 <strong>${total.toLocaleString("ko-KR")}원</strong>`;
    }

    function applyFilter(m) {
      activeMerchant = m;
      chipsEl.querySelectorAll(".hfc").forEach(c => c.classList.toggle("active", c.dataset.m === m));
      updateStat(m);
      const list = document.getElementById("history-list");
      list.querySelectorAll(".hrc").forEach(card => {
        const cm = card.dataset.merchant || "알 수 없음";
        card.style.display = (m === "전체" || cm === m) ? "" : "none";
      });
    }

    merchants.forEach(m => {
      const btn = document.createElement("button");
      btn.className = "hfc" + (m === "전체" ? " active" : "");
      btn.dataset.m = m;
      btn.textContent = m;
      btn.addEventListener("click", () => applyFilter(m));
      chipsEl.appendChild(btn);
    });

    bar.innerHTML = "";
    bar.appendChild(chipsEl);
    bar.appendChild(statEl);
    bar.style.display = "flex";

    // 초기 필터 (weekly 패널에서 업체명 클릭 시)
    if (initialFilter && merchants.includes(initialFilter)) {
      applyFilter(initialFilter);
    } else {
      updateStat("전체");
    }
  }

  function _weeklyDefaultDates() {
    const end = new Date();
    const start = new Date();
    start.setDate(start.getDate() - 30);
    return {
      start: start.toISOString().slice(0, 10),
      end: end.toISOString().slice(0, 10),
    };
  }

  let _weeklyExportData = null;

  // 업체별 고정 색상: 알려진 업체는 지정색, 나머지는 이름 해시로 결정
  const _MERCHANT_FIXED = {
    "이마트":    "#f59e0b",
    "쿠팡":      "#dc2626",
    "네이버":    "#16a34a",
    "네이버쇼핑": "#16a34a",
  };
  const _MERCHANT_PALETTE = [
    "#dc2626","#7c3aed","#0891b2","#ea580c",
    "#be185d","#065f46","#92400e","#1e3a8a",
  ];
  function _merchantColor(name) {
    if (_MERCHANT_FIXED[name]) return _MERCHANT_FIXED[name];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    return _MERCHANT_PALETTE[h % _MERCHANT_PALETTE.length];
  }

  async function openWeeklyPanel() {
    document.getElementById("weekly-overlay").classList.add("open");
    const content = document.getElementById("weekly-content");
    const startInput = document.getElementById("weekly-start-date");
    const endInput   = document.getElementById("weekly-end-date");

    // 기본값 설정 (최초 1회)
    if (!startInput.value || !endInput.value) {
      const { start, end } = _weeklyDefaultDates();
      startInput.value = start;
      endInput.value   = end;
    }

    const fromDate = startInput.value;
    const toDate   = endInput.value;

    content.innerHTML = '<p class="week-empty">불러오는 중…</p>';
    const titleEl = document.querySelector(".weekly-title");
    titleEl.textContent = "📅 주간 지출 (불러오는 중…)";

    try {
      const url = `/grocery/history?user_id=${encodeURIComponent(USER_CODE)}&start_date=${fromDate}&end_date=${toDate}`;
      const rows = await fetch(url).then(r => r.json());
      content.innerHTML = "";

      if (!rows || rows.length === 0) {
        content.innerHTML = '<p class="week-empty">해당 기간에 저장된 영수증이 없어요.<br>영수증 분석기에서 영수증을 추가해보세요 🧾</p>';
        titleEl.textContent = "📅 주간 지출";
        return;
      }

      function weekMonday(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        const day = d.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        return d.toISOString().slice(0, 10);
      }

      console.log("[weekly] 조회 범위:", fromDate, "~", toDate, "/ 반환 영수증 수:", rows.length);
      console.table(rows.map(r => ({ id: r.id, merchant: r.merchant, purchase_date: r.purchase_date, total: r.total, is_refund: r.is_refund })));

      const weekMap = new Map();
      rows.forEach(r => {
        if (!r.purchase_date || !r.total) {
          console.log("[weekly] 제외됨:", r.id, r.merchant, "날짜:", r.purchase_date, "금액:", r.total);
          return;
        }
        const wk = weekMonday(r.purchase_date);
        if (!weekMap.has(wk)) weekMap.set(wk, { total: 0, receipts: [] });
        const entry = weekMap.get(wk);
        entry.total += r.total;
        entry.receipts.push(r);
      });

      const weeks    = [...weekMap.entries()].sort((a, b) => b[0].localeCompare(a[0]));
      const maxTotal = Math.max(...weeks.map(([, v]) => v.total));
      const totalSpent = weeks.reduce((s, [, { total }]) => s + total, 0);

      const fmtDate = s => {
        const d = new Date(s + "T00:00:00");
        return `${d.getMonth() + 1}/${d.getDate()}`;
      };
      const fmtAmt = n => n.toLocaleString("ko-KR") + "원";

      // export용 데이터 초기화
      _weeklyExportData = { fromDate, toDate, totalSpent, fmtDate, weeks: [] };

      const fromLabel = fmtDate(fromDate);
      const toLabel   = fmtDate(toDate);
      titleEl.textContent = `📅 주간 지출 (${fromLabel}~${toLabel}: ${totalSpent.toLocaleString("ko-KR")}원)`;

      const thisMonday = weekMonday(new Date().toISOString().slice(0, 10));

      weeks.forEach(([monday, { total, receipts }], idx) => {
        const endDt = new Date(monday + "T00:00:00");
        endDt.setDate(endDt.getDate() + 6);
        const endStr = endDt.toISOString().slice(0, 10);

        let weekLabel;
        if (monday === thisMonday)           weekLabel = `이번 주 (${fmtDate(monday)} ~ ${fmtDate(endStr)})`;
        else if (idx === 0)                  weekLabel = `저번 주 (${fmtDate(monday)} ~ ${fmtDate(endStr)})`;
        else                                 weekLabel = `${fmtDate(monday)} ~ ${fmtDate(endStr)}`;

        const merchantMap = new Map();
        receipts.forEach(r => {
          const m = r.merchant || "알 수 없음";
          merchantMap.set(m, (merchantMap.get(m) || 0) + (r.total || 0));
        });
        const topMerchants = [...merchantMap.entries()].sort((a, b) => b[1] - a[1]);

        const colorMap = new Map();
        topMerchants.forEach(([m]) => colorMap.set(m, _merchantColor(m)));

        const card = document.createElement("div");
        card.className = "week-card";
        card.innerHTML = `
          <div class="week-card-header">
            <span class="week-label">${weekLabel}</span>
            <span class="week-total">${fmtAmt(total)}</span>
          </div>
          <div class="week-stacked-bar"></div>
          <div class="week-merchants"></div>
        `;

        // stacked bar — 각 업체 비중 세그먼트
        const stackedBar = card.querySelector(".week-stacked-bar");
        let _accPct = 0;
        topMerchants.forEach(([m, t], si) => {
          const rawPct = total > 0 ? (t / total) * 100 : 0;
          const isLast = si === topMerchants.length - 1;
          const pct = isLast ? (100 - _accPct) : Math.round(rawPct);
          if (!isLast) _accPct += pct;
          const seg = document.createElement("div");
          seg.className = "week-stacked-segment";
          seg.style.width = pct + "%";
          seg.style.background = colorMap.get(m);
          seg.title = `${m} ${Math.round(rawPct)}%`;
          stackedBar.appendChild(seg);
        });

        // 업체 목록 — 색상 도트 + 업체명(클릭) + 금액
        const merchantsEl = card.querySelector(".week-merchants");
        topMerchants.forEach(([m, t]) => {
          const row = document.createElement("div");
          row.className = "week-merchant-row";

          const dot = document.createElement("span");
          dot.className = "week-merchant-dot";
          dot.style.background = colorMap.get(m);

          const nameEl = document.createElement("span");
          nameEl.className = "week-merchant-name";
          nameEl.textContent = m;
          nameEl.addEventListener("click", () => {
            document.getElementById("weekly-overlay").classList.remove("open");
            openHistoryPanel(m, fromDate, toDate);
          });

          const amtEl = document.createElement("span");
          amtEl.className = "week-merchant-amt";
          amtEl.textContent = fmtAmt(t);

          row.appendChild(dot);
          row.appendChild(nameEl);
          row.appendChild(amtEl);
          merchantsEl.appendChild(row);
        });

        // export 데이터 수집
        _weeklyExportData.weeks.push({
          weekLabel, total, topMerchants,
          colorMap: Object.fromEntries(colorMap),
        });

        content.appendChild(card);
      });
    } catch (err) {
      content.innerHTML = `<p class="week-empty">오류: ${err.message}</p>`;
    }
  }

  function _buildWeeklyExportHtml() {
    if (!_weeklyExportData) return null;
    const { fromDate, toDate, totalSpent, fmtDate, weeks } = _weeklyExportData;
    const fmtAmt = n => n.toLocaleString("ko-KR") + "원";
    const fmtFull = s => {
      const d = new Date(s + "T00:00:00");
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
    };

    const weeksHtml = weeks.map(({ weekLabel, total, topMerchants, colorMap }) => {
      let acc = 0;
      const barSegs = topMerchants.map(([m, t], si) => {
        const rawPct = total > 0 ? (t / total) * 100 : 0;
        const isLast = si === topMerchants.length - 1;
        const pct = isLast ? (100 - acc) : Math.round(rawPct);
        if (!isLast) acc += pct;
        return `<div style="height:100%;width:${pct}%;background:${colorMap[m]};"></div>`;
      }).join("");

      const tableRows = topMerchants.map(([m, t]) => {
        const pct = total > 0 ? Math.round((t / total) * 100) : 0;
        return `<tr>
          <td style="padding:6px 8px;border-top:1px solid #f0f0f0;">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorMap[m]};margin-right:6px;vertical-align:middle;"></span>${m}
          </td>
          <td style="padding:6px 8px;text-align:right;border-top:1px solid #f0f0f0;color:#888;">${pct}%</td>
          <td style="padding:6px 8px;text-align:right;border-top:1px solid #f0f0f0;font-weight:700;">${fmtAmt(t)}</td>
        </tr>`;
      }).join("");

      return `<div style="margin-bottom:20px;border:1.5px solid #e5e7eb;border-radius:12px;padding:16px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
          <span style="font-weight:600;color:#555;font-size:13px;">${weekLabel}</span>
          <span style="font-weight:800;font-size:17px;color:#111;">${fmtAmt(total)}</span>
        </div>
        <div style="display:flex;border-radius:6px;overflow:hidden;height:12px;margin-bottom:14px;">${barSegs}</div>
        <table style="width:100%;border-collapse:collapse;font-size:13.5px;">${tableRows}</table>
      </div>`;
    }).join("");

    return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>주간 지출 현황 ${fmtFull(fromDate)}~${fmtFull(toDate)}</title>

  body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Malgun Gothic", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 24px; color: #111; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 28px; }

  .pdf-save-bar { position: sticky; top: 0; background: #fff; padding: 10px 0 12px; margin-bottom: 20px; display: flex; gap: 8px; border-bottom: 1px solid #e5e7eb; z-index: 10; }
  .pdf-save-btn { padding: 8px 20px; background: #0078d4; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .pdf-save-btn:hover { background: #106ebe; }
  @media print { .pdf-save-bar { display: none; } body { margin: 16px; } }
</style>
</head>
<body>
<div class="pdf-save-bar">
  <button class="pdf-save-btn" onclick="window.print()">PDF 저장</button>
</div>
<h1>주간 지출 현황</h1>
<div class="sub">${fmtFull(fromDate)} ~ ${fmtFull(toDate)} &nbsp;·&nbsp; 합계 <strong>${fmtAmt(totalSpent)}</strong></div>
${weeksHtml}
<div class="foot">출력일: ${new Date().toLocaleDateString("ko-KR")}</div>
</body>
</html>`;
  }

  function _buildHistoryCard(r) {
    const fmtAmt = n => n != null ? Math.abs(n).toLocaleString("ko-KR") + "원" : "—";

    const card = document.createElement("div");
    card.className = "hrc";
    card.dataset.id       = r.id;
    card.dataset.merchant = r.merchant     || "";
    card.dataset.date     = r.purchase_date || "";
    if (r.total != null) card.dataset.total = r.total;

    const row = document.createElement("div");
    row.className = "hrc-row";

    const check = document.createElement("div");
    check.className = "hrc-check";
    check.textContent = "✓";

    const icon = document.createElement("div");
    icon.className = "hrc-icon";
    icon.textContent = r.is_refund ? "↩" : "🧾";

    const body = document.createElement("div");
    body.className = "hrc-body";
    const merchantDiv = document.createElement("div");
    merchantDiv.className = "hrc-merchant";
    merchantDiv.textContent = r.merchant || "알 수 없음";
    const metaDiv = document.createElement("div");
    metaDiv.className = "hrc-meta";
    metaDiv.textContent = `${r.purchase_date || "날짜 미상"} · ${r.item_count ?? 0}개 품목`;
    body.appendChild(merchantDiv);
    body.appendChild(metaDiv);

    const right = document.createElement("div");
    right.className = "hrc-right";
    const amountDiv = document.createElement("div");
    amountDiv.className = "hrc-amount";
    amountDiv.textContent = fmtAmt(r.total);
    const arrow = document.createElement("div");
    arrow.className = "hrc-expand";
    arrow.textContent = "▼";
    right.appendChild(amountDiv);
    right.appendChild(arrow);

    row.appendChild(check);
    row.appendChild(icon);
    row.appendChild(body);

    const editBtn = document.createElement("button");
    editBtn.className = "hrc-edit-btn";
    editBtn.textContent = "수정";
    editBtn.addEventListener("click", e => {
      e.stopPropagation();
      openEditModal(r.id, r.merchant || "", r.purchase_date || "");
    });
    right.appendChild(editBtn);

    row.appendChild(right);

    const detail = document.createElement("div");
    detail.className = "hrc-detail";

    card.appendChild(row);
    card.appendChild(detail);

    // 화살표 클릭: 삭제 모드와 무관하게 항상 상세 펼치기/접기
    arrow.addEventListener("click", e => {
      e.stopPropagation();
      const isExpanded = card.classList.contains("expanded");
      card.classList.toggle("expanded");
      if (!isExpanded && !detail.dataset.loaded) {
        _loadReceiptDetail(r.id, detail);
      }
      if (!isExpanded) {
        setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
      }
    });

    row.addEventListener("click", () => {
      if (_historyDeleteMode) {
        const id = parseInt(card.dataset.id);
        if (_historySelected.has(id)) {
          _historySelected.delete(id);
          _historySelectedData.delete(id);
          card.classList.remove("checked");
        } else {
          _historySelected.add(id);
          _historySelectedData.set(id, { merchant: r.merchant, purchase_date: r.purchase_date, total: r.total });
          card.classList.add("checked");
        }
        _updateDeleteHeader();
      } else {
        const isExpanded = card.classList.contains("expanded");
        card.classList.toggle("expanded");
        if (!isExpanded && !detail.dataset.loaded) {
          _loadReceiptDetail(r.id, detail);
        }
        if (!isExpanded) {
          setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
        }
      }
    });

    return card;
  }

  async function _loadReceiptDetail(receiptId, detailEl) {
    detailEl.innerHTML = '<p style="font-size:0.8rem;color:#aaa;padding:4px 0">불러오는 중…</p>';
    try {
      const data = await fetch(
        `/grocery/receipt/${receiptId}?user_id=${encodeURIComponent(USER_CODE)}`
      ).then(r => r.json());
      detailEl.innerHTML = "";
      detailEl.dataset.loaded = "1";
      _renderReceiptDetail(data, detailEl);
    } catch (err) {
      detailEl.innerHTML = `<p style="font-size:0.8rem;color:#dc2626">오류: ${err.message}</p>`;
    }
  }

  function _renderReceiptDetail(data, el) {
    const fmt = n => {
      if (n == null) return "—";
      const s = Math.abs(n).toLocaleString("ko-KR") + "원";
      return n < 0 ? "−" + s : s;
    };
    const items = data.items || [];
    const table = document.createElement("table");
    table.className = "hrc-items-table";
    items.forEach(item => {
      const tr = document.createElement("tr");
      if (item.is_cancelled) tr.className = "cancelled";
      else if ((item.amount || 0) < 0) tr.className = "discount";
      tr.innerHTML = `
        <td>${item.raw_name || "—"}</td>
        <td style="text-align:center;color:#bbb;width:28px">${(item.qty || 1) > 1 ? item.qty : ""}</td>
        <td>${fmt(item.amount)}</td>
      `;
      table.appendChild(tr);
    });
    el.appendChild(table);
    if (data.total != null) {
      const totalRow = document.createElement("div");
      totalRow.className = "hrc-total-row";
      totalRow.innerHTML = `<span>합계</span><span>${fmt(data.total)}</span>`;
      el.appendChild(totalRow);
    }
    if (data.created_at) {
      const createdDiv = document.createElement("div");
      createdDiv.style.cssText = "font-size:0.7rem;color:#bbb;margin-top:8px;text-align:right";
      createdDiv.textContent = `저장: ${data.created_at.substring(0, 16).replace("T", " ")}`;
      el.appendChild(createdDiv);
    }
  }

  loadInfo();

  // ── 이전 대화 이력 복원 ──
  async function loadChatHistory() {
    try {
      const msgs = await fetch(`/chat/history?session_id=${SESSION_ID}`).then(r => r.json());
      if (!msgs || msgs.length === 0) return;
      msgs.forEach(msg => {
        const { row, bubble } = addBubble(msg.role);
        if (msg.role === "user") {
          bubble.textContent = msg.content;
        } else {
          renderMarkdown(bubble, msg.content);
        }
      });
      chatWrap.scrollTop = chatWrap.scrollHeight;
    } catch {}
  }
  loadChatHistory();

  // ── 세션 내 저장 영수증 누적 (세션 스토리지) ──
  function _accumulateSessionReceipts(receipts) {
    try {
      const prev = JSON.parse(sessionStorage.getItem("sessionSavedReceipts") || "[]");
      sessionStorage.setItem("sessionSavedReceipts", JSON.stringify([...prev, ...receipts]));
    } catch(e) {}
  }
  function _getSessionReceipts() {
    try { return JSON.parse(sessionStorage.getItem("sessionSavedReceipts") || "[]"); } catch(e) { return []; }
  }

  // ── grocery_saved 자동 요약 ──
  const _params = new URLSearchParams(window.location.search);
  if (_params.get("grocery_saved")) {
    history.replaceState({}, "", "/chat");

    // 구/신 포맷 모두 지원
    let _receipts = [];
    try {
      const _raw = sessionStorage.getItem("pendingReceipts") || sessionStorage.getItem("pendingReceipt");
      if (_raw) {
        const _parsed = JSON.parse(_raw);
        _receipts = Array.isArray(_parsed) ? _parsed : [_parsed];
      }
    } catch(e) {}
    sessionStorage.removeItem("pendingReceipts");
    sessionStorage.removeItem("pendingReceipt");

    if (_receipts.length > 0) _accumulateSessionReceipts(_receipts);

    setTimeout(() => {
      if (_receipts.length > 0) {
        renderReceiptsIntoChat(_receipts);
      }

      const _summary = _receipts.map(r => {
        const items = (r.items||[]).filter(i=>!i.is_cancelled && i.amount != null && i.amount > 0);
        const discounts = (r.items||[]).filter(i=>!i.is_cancelled && i.amount != null && i.amount < 0);
        const discTotal = discounts.reduce((s,i)=>s+i.amount,0);
        const lines = items.map(i=>`  - ${i.raw_name}: ${(i.amount||0).toLocaleString("ko-KR")}원`).join("\n");
        const discLine = discTotal<0 ? `\n  할인: ${discTotal.toLocaleString("ko-KR")}원` : "";
        const totalLine = r.total ? `\n  합계: ${r.total.toLocaleString("ko-KR")}원` : "";
        return `[${r.merchant||"알 수 없음"} · ${r.purchase_date||"날짜 미상"}]\n${lines}${discLine}${totalLine}`;
      }).join("\n\n");

      const msg = `[방금 저장한 영수증]\n${_summary}\n\n이 구매에서 특별히 메모하거나 확인하고 싶은 게 있나요?`;
      sendText(msg);
    }, 400);
  }

  // URL param: ?panel=history|weekly → auto-open overlay
  const _urlPanel = new URLSearchParams(location.search).get("panel");
  if (_urlPanel === "history") openHistoryPanel();
  else if (_urlPanel === "weekly") openWeeklyPanel();
</script>
