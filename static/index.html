<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영수증 분석</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: #1a1a1a; text-align: center; }
    .header-left  { display: flex; align-items: center; }
    .header-right { display: flex; justify-content: flex-end; }

    /* ── hamburger button ── */
    #hamburger-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      color: #444;
      line-height: 1;
    }
    #hamburger-btn:hover { background: #f0f0f0; }

    /* ── hamburger dropdown ── */
    #hamburger-menu {
      display: none;
      position: fixed;
      top: 54px; left: 12px;
      min-width: 196px;
      max-width: calc(100vw - 24px);
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.13);
      z-index: 300;
      overflow: hidden;
    }
    #hamburger-menu.open { display: block; }
    .hmenu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid #f3f3f3;
      font-size: 0.88rem;
      color: #222;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: background 0.12s;
    }
    .hmenu-item:last-child { border-bottom: none; }
    .hmenu-item:hover { background: #f7f9fc; }
    .hmenu-user {
      padding: 10px 16px 8px;
      font-size: 0.78rem;
      color: #888;
      border-bottom: 1px solid #f3f3f3;
    }

    /* ── usage panel ── */
    #usage-panel {
      display: none;
      position: fixed;
      top: 54px; left: 12px;
      width: min(300px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 200;
      padding: 14px 16px;
    }
    #usage-panel.open { display: block; }
    #usage-panel h3 { font-size: 0.85rem; margin-bottom: 10px; color: #333; }
    .usage-row {
      font-size: 0.78rem;
      color: #555;
      padding: 5px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .usage-row:last-child { border-bottom: none; }

    /* ── memory panel ── */
    #memory-panel {
      display: none;
      position: fixed;
      top: 54px; left: 12px;
      width: min(300px, calc(100vw - 24px));
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 100;
      padding: 14px;
    }
    #memory-panel.open { display: block; }
    #memory-panel h3 { font-size: 0.85rem; margin-bottom: 10px; color: #333; }
    #memory-list { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .mem-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.78rem; background: #f7f9fc;
      border-radius: 6px; padding: 5px 8px;
    }
    .mem-key   { font-weight: 600; color: #0078d4; }
    .mem-val   { flex: 1; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mem-del   { background: none; border: none; cursor: pointer; color: #aaa; font-size: 0.8rem; padding: 0 2px; }
    .mem-del:hover { color: #e00; }
    .mem-add-row { display: flex; gap: 6px; }
    .mem-add-row input {
      flex: 1; border: 1px solid #ddd; border-radius: 6px;
      padding: 5px 8px; font-size: 0.78rem; outline: none;
    }
    .mem-add-row input:focus { border-color: #0078d4; }
    .mem-add-btn {
      padding: 5px 10px; background: #0078d4; color: #fff;
      border: none; border-radius: 6px; font-size: 0.75rem; cursor: pointer;
    }
    .mem-add-btn:hover { background: #106ebe; }
    #mem-empty { font-size: 0.75rem; color: #aaa; text-align: center; padding: 6px 0; }

    /* ── receipt report card ── */
    .receipt-report-block {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 2px;
    }
    .receipt-report-label {
      font-size: 0.72rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .receipt-report-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .rrc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px 10px;
      background: #f8fafc;
      border-bottom: 1px solid #f0f0f0;
    }
    .rrc-merchant { font-size: 0.95rem; font-weight: 700; color: #111; }
    .rrc-date { font-size: 0.75rem; color: #888; }
    .rrc-items { padding: 8px 14px; }
    .rrc-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 4px 0;
      color: #444;
      border-bottom: 1px solid #f8f8f8;
    }
    .rrc-item:last-child { border-bottom: none; }
    .rrc-item.discount { color: #dc2626; }
    .rrc-item.more { color: #aaa; font-size: 0.78rem; }
    .rrc-sub-header {
      font-size: 0.72rem;
      font-weight: 600;
      color: #888;
      padding: 8px 14px 2px;
      letter-spacing: 0.02em;
      border-top: 1px solid #f0f0f0;
    }
    .rrc-sub-header:first-of-type { border-top: none; }
    .rrc-subtotal {
      display: flex;
      justify-content: space-between;
      padding: 6px 14px 8px;
      font-size: 0.8rem;
      color: #555;
      background: #fafafa;
    }
    .rrc-total {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: #f8fafc;
      border-top: 1px solid #f0f0f0;
      font-weight: 700;
      font-size: 0.88rem;
    }

    /* ── receipt delete block ── */
    .receipt-delete-block {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 2px;
    }
    .receipt-delete-label {
      font-size: 0.72rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.04em;
    }
    .receipt-delete-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: opacity 0.3s;
    }
    .receipt-delete-card.deleted { opacity: 0.35; background: #f9fafb; }
    .rdc-id {
      font-size: 0.72rem;
      color: #bbb;
      font-weight: 600;
      min-width: 34px;
      text-align: center;
    }
    .rdc-info { flex: 1; min-width: 0; }
    .rdc-merchant { font-size: 0.88rem; font-weight: 700; color: #111; }
    .rdc-meta { font-size: 0.73rem; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rdc-del-btn {
      padding: 6px 11px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
      font-family: inherit;
    }
    .rdc-del-btn:hover:not(:disabled) { background: #fecaca; }
    .rdc-del-btn:disabled { background: #f3f4f6; color: #ccc; border-color: #e5e7eb; cursor: default; }

    /* ── receipt history overlay ── */
    #history-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f6f8;
      z-index: 500;
      flex-direction: column;
    }
    #history-overlay.open { display: flex; }
    .history-header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .history-title { flex: 1; font-size: 1rem; font-weight: 700; color: #111; }
    .history-add-btn {
      padding: 7px 12px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .history-add-btn:hover { background: #106ebe; }
    .history-del-toggle {
      padding: 7px 10px;
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      font-family: inherit;
    }
    .history-del-toggle.active { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .history-del-confirm {
      display: none;
      padding: 7px 12px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .history-del-confirm.visible { display: block; }
    .history-sel-all {
      display: none;
      padding: 7px 10px;
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #555;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .history-sel-all.visible { display: block; }
    .history-sel-all.all-selected { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }
    .history-close-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #666;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .history-close-btn:hover { background: #f0f0f0; }
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 800px;
      width: 100%;
      align-self: center;
    }
    .history-empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 0.88rem; line-height: 1.8; }
    .hrc {
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      transition: border-color 0.15s;
    }
    .hrc.checked { border-color: #0078d4; background: #f0f7ff; }
    .hrc-row {
      display: flex;
      align-items: flex-start;
      padding: 12px 14px;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .hrc-row:hover { background: #fafafa; }
    .hrc.checked .hrc-row { background: transparent; }
    .hrc-check {
      display: none;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #ccc;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      color: transparent;
      transition: all 0.15s;
    }
    .delete-mode .hrc-check { display: flex; }
    .hrc.checked .hrc-check { background: #0078d4; border-color: #0078d4; color: #fff; }
    .hrc-icon { font-size: 1.2rem; flex-shrink: 0; padding-top: 1px; }
    .hrc-body { flex: 1; min-width: 0; }
    .hrc-merchant { font-size: 0.9rem; font-weight: 700; color: #111; word-break: keep-all; }
    .hrc-meta { font-size: 0.73rem; color: #888; margin-top: 3px; }
    .hrc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
    .hrc-amount { font-size: 0.88rem; font-weight: 700; color: #111; white-space: nowrap; }
    .hrc-expand { font-size: 0.68rem; color: #bbb; transition: transform 0.2s; line-height: 1; }
    .hrc.expanded .hrc-expand { transform: rotate(180deg); }
    .hrc-detail {
      max-height: 0;
      overflow: hidden;
      background: #fafafa;
      transition: max-height 0.25s ease;
    }
    .hrc.expanded .hrc-detail {
      max-height: 600px;
      overflow-y: auto;
      border-top: 1px solid #f0f0f0;
      padding: 10px 14px 14px;
    }
    .hrc-items-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .hrc-items-table td { padding: 5px 4px; border-bottom: 1px solid #f0f0f0; color: #333; }
    .hrc-items-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hrc-items-table tr.cancelled td { color: #bbb; text-decoration: line-through; }
    .hrc-items-table tr.discount td { color: #dc2626; }
    .hrc-total-row {
      display: flex;
      justify-content: space-between;
      padding-top: 8px;
      margin-top: 4px;
      border-top: 1px solid #e5e7eb;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* ── chat area ── */
    #chat-wrap {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }
    .bubble-row.user      { align-self: flex-end;   align-items: flex-end; }
    .bubble-row.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
    }
    .user .bubble {
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .assistant .bubble.streaming { white-space: pre-wrap; }

    /* image in user bubble */
    .bubble-img {
      max-width: 240px;
      max-height: 240px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
      object-fit: cover;
    }

    /* ── markdown styles ── */
    .assistant .bubble h1,
    .assistant .bubble h2,
    .assistant .bubble h3,
    .assistant .bubble h4 {
      margin: 0.9em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .assistant .bubble h1 { font-size: 1.25em; }
    .assistant .bubble h2 { font-size: 1.1em; }
    .assistant .bubble h3 { font-size: 1em; }
    .assistant .bubble p { margin: 0.5em 0; }
    .assistant .bubble p:first-child { margin-top: 0; }
    .assistant .bubble p:last-child  { margin-bottom: 0; }
    .assistant .bubble ul,
    .assistant .bubble ol { margin: 0.5em 0 0.5em 1.4em; }
    .assistant .bubble li { margin: 0.2em 0; }
    .assistant .bubble blockquote {
      border-left: 3px solid #0078d4;
      margin: 0.6em 0;
      padding: 4px 12px;
      color: #555;
      background: #f7f9fc;
      border-radius: 0 6px 6px 0;
    }
    .assistant .bubble a { color: #0078d4; text-decoration: underline; }
    .assistant .bubble code {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85em;
    }
    .assistant .bubble pre {
      margin: 0.6em 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    .assistant .bubble pre code {
      display: block;
      padding: 12px 14px;
      overflow-x: auto;
      background: #f6f8fa;
      border: none;
      border-radius: 0;
      font-size: 0.83em;
      line-height: 1.55;
    }
    .assistant .bubble table {
      border-collapse: collapse;
      margin: 0.6em 0;
      font-size: 0.85em;
      width: 100%;
    }
    .assistant .bubble th,
    .assistant .bubble td {
      border: 1px solid #dde1e7;
      padding: 6px 10px;
      text-align: left;
    }
    .assistant .bubble th { background: #f3f4f6; font-weight: 600; }
    .assistant .bubble tr:nth-child(even) td { background: #fafafa; }
    .assistant .bubble hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 0.8em 0;
    }

    /* ── cursor ── */
    .typing-cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .usage-tag {
      font-size: 0.68rem;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    /* ── footer / input ── */
    footer {
      width: 100%;
      max-width: 800px;
      padding: 8px 16px 20px;
    }

    /* image preview strip above input */
    #img-preview-wrap {
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      padding: 6px 10px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 10px;
    }
    #img-preview-wrap.visible { display: flex; }
    #img-preview {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    #img-preview-name {
      flex: 1;
      font-size: 0.78rem;
      color: #555;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #img-remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #999;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #img-remove-btn:hover { background: #f0f0f0; color: #333; }

    .input-row {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.9rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      background: transparent;
    }

    #img-btn {
      align-self: flex-end;
      padding: 7px 10px;
      background: none;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      color: #555;
      transition: background 0.15s;
      line-height: 1;
    }
    #img-btn:hover { background: #f0f0f0; }

    #send-btn {
      align-self: flex-end;
      padding: 7px 16px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #106ebe; }
    #send-btn:disabled { background: #b0c8e8; cursor: not-allowed; }

    /* DB 저장 뱃지 */
    .saved-badge {
      font-size: 0.65rem;
      color: #0078d4;
      margin-top: 2px;
      padding: 0 4px;
    }

    /* filter bar */
    .history-filter-bar {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .history-filter-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hfc {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
      font-family: inherit;
    }
    .hfc.active { border-color: #0078d4; background: #e8f3fc; color: #0078d4; }
    .history-filter-stat {
      font-size: 0.78rem;
      color: #888;
      padding: 2px 4px;
    }
    .history-filter-stat strong { color: #111; }

    /* weekly overlay */
    #weekly-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #f5f6f8;
      z-index: 500;
      flex-direction: column;
    }
    #weekly-overlay.open { display: flex; }
    .weekly-header {

  </style>
</head>

<!-- hamburger dropdown -->
<div id="hamburger-menu">

  <a href="/grocery" class="hmenu-item">🧾 영수증 분석기</a>
  <button id="history-btn" class="hmenu-item">📋 영수증 이력</button>

    <span class="weekly-title">📅 주간 지출</span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // ── auth guard ──
  const _authCode = localStorage.getItem("grocery_user_code");
  if (!_authCode) { window.location.replace("/grocery"); }
  const USER_CODE = _authCode || "";

  marked.setOptions({
    highlight: (code, lang) => {
      const language = hljs.getLanguage(lang) ? lang : "plaintext";
      return hljs.highlight(code, { language }).value;
    },
    breaks: true,
    gfm: true,
  });

  const chatWrap      = document.getElementById("chat-wrap");
  const inputEl       = document.getElementById("input");
  const sendBtn       = document.getElementById("send-btn");
  const imgBtn        = document.getElementById("img-btn");
  const fileInput     = document.getElementById("file-input");
  const previewWrap   = document.getElementById("img-preview-wrap");
  const previewImg    = document.getElementById("img-preview");
  const previewName   = document.getElementById("img-preview-name");
  const imgRemoveBtn  = document.getElementById("img-remove-btn");
  const hamburgerBtn  = document.getElementById("hamburger-btn");
  const hamburgerMenu = document.getElementById("hamburger-menu");
  const memoryPanel   = document.getElementById("memory-panel");
  const memoryBtn     = document.getElementById("memory-btn");
  const usagePanel    = document.getElementById("usage-panel");
  const usageBtn      = document.getElementById("usage-btn");

  let streaming    = false;
  let pendingImage = null;

  // ── image picker ──
  imgBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    pendingImage = file;
    previewImg.src = URL.createObjectURL(file);
    previewName.textContent = file.name;
    previewWrap.classList.add("visible");
    fileInput.value = "";
  });
  imgRemoveBtn.addEventListener("click", clearImage);

  function clearImage() {
    pendingImage = null;
    previewImg.src = "";
    previewWrap.classList.remove("visible");
  }

  // ── textarea ──
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);

  // ── session ──
  function getSessionId() {
    let sid = localStorage.getItem("chat_session_id");
    if (!sid) {
      sid = crypto.randomUUID();
      localStorage.setItem("chat_session_id", sid);
    }
    return sid;
  }
  const SESSION_ID = getSessionId();
  document.getElementById("hmenu-user-code").textContent = USER_CODE;

  // ── info ──
  async function loadInfo() {
    const d = await fetch(`/info?session_id=${SESSION_ID}`).then(r => r.json());
    document.getElementById("deployment-label").textContent = `모델: ${d.deployment}`;
    document.getElementById("rate-label").textContent =
      `환율: 1 USD = ₩${d.usd_to_krw.toLocaleString("ko-KR", { maximumFractionDigits: 1 })} (${d.rate_date})`;
    updateCostLabel(d.total_cost_usd, d.total_cost_krw, d.total_tokens);
    updateTurnsLabel(d.current_turns, d.max_history_turns);
  }

  function updateCostLabel(usd, krw, tokens) {
    document.getElementById("cost-label").textContent =
      `누적: $${usd.toFixed(6)} (₩${krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}) · ${tokens} tokens`;
  }

  function updateTurnsLabel(cur, max) {
    const el = document.getElementById("turns-label");
    const pct = max > 0 ? cur / max : 0;
    const color = pct >= 0.9 ? "#e00" : pct >= 0.7 ? "#f90" : "#888";
    el.innerHTML = `<span style="color:${color}">대화: ${cur}/${max}</span>`;
  }

  // ── hamburger + panel management ──
  function closeAllPanels() {
    hamburgerMenu.classList.remove("open");
    memoryPanel.classList.remove("open");
    usagePanel.classList.remove("open");
  }

  hamburgerBtn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = hamburgerMenu.classList.contains("open");
    closeAllPanels();
    if (!wasOpen) hamburgerMenu.classList.add("open");
  });

  memoryBtn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = memoryPanel.classList.contains("open");
    closeAllPanels();
    if (!wasOpen) { memoryPanel.classList.add("open"); renderMemory(); }
  });

  usageBtn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = usagePanel.classList.contains("open");
    closeAllPanels();
    if (!wasOpen) usagePanel.classList.add("open");
  });

  document.getElementById("reset-btn").addEventListener("click", e => {
    e.stopPropagation();
    closeAllPanels();
    resetChat();
  });

  document.getElementById("logout-btn").addEventListener("click", e => {
    e.stopPropagation();
    localStorage.removeItem("grocery_user_code");
    window.location.href = "/grocery";
  });

  document.getElementById("history-btn").addEventListener("click", e => {
    e.stopPropagation();
    closeAllPanels();
    openHistoryPanel();
  });

  // 패널 내부 클릭은 전파 차단
  hamburgerMenu.addEventListener("click", e => e.stopPropagation());
  memoryPanel.addEventListener("click",   e => e.stopPropagation());
  usagePanel.addEventListener("click",    e => e.stopPropagation());

  // 외부 클릭 시 모두 닫기
  document.addEventListener("click", closeAllPanels);

  async function renderMemory() {
    const mem = await fetch(`/memory?session_id=${SESSION_ID}`).then(r => r.json());
    const list = document.getElementById("memory-list");
    list.innerHTML = "";
    const entries = Object.entries(mem);
    if (entries.length === 0) {
      list.innerHTML = '<div id="mem-empty">저장된 정보 없음</div>';
      return;
    }
    entries.forEach(([k, v]) => {
      const item = document.createElement("div");
      item.className = "mem-item";
      item.innerHTML =
        `<span class="mem-key">${k}</span><span class="mem-val">${v}</span>` +
        `<button class="mem-del" data-key="${k}" title="삭제">✕</button>`;
      list.appendChild(item);
    });
    list.querySelectorAll(".mem-del").forEach(btn => {
      btn.addEventListener("click", async () => {
        await fetch(`/memory/${encodeURIComponent(btn.dataset.key)}?session_id=${SESSION_ID}`, { method: "DELETE" });
        renderMemory();
      });
    });
  }

  document.getElementById("mem-add-btn").addEventListener("click", async () => {
    const k = document.getElementById("mem-key-input").value.trim();
    const v = document.getElementById("mem-val-input").value.trim();
    if (!k || !v) return;
    await fetch(`/memory?session_id=${SESSION_ID}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: k, value: v }),
    });
    document.getElementById("mem-key-input").value = "";
    document.getElementById("mem-val-input").value = "";
    renderMemory();
  });

  // ── bubble helpers ──
  function addBubble(role, text = "") {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user" && text) bubble.textContent = text;
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return { row, bubble };
  }

  function renderMarkdown(bubble, raw) {
    bubble.classList.remove("streaming", "typing-cursor");
    bubble.innerHTML = marked.parse(raw);
    bubble.querySelectorAll("pre code:not(.hljs)").forEach(el => hljs.highlightElement(el));
  }

  function appendUsageTag(row, u) {
    const tag = document.createElement("div");
    tag.className = "usage-tag";
    tag.textContent =
      `${u.prompt_tokens} in / ${u.completion_tokens} out · ` +
      `$${u.turn_cost_usd.toFixed(6)} (₩${u.turn_cost_krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
    row.appendChild(tag);
    if (u.total_cost_usd !== undefined) {
      updateCostLabel(u.total_cost_usd, u.total_cost_krw, u.total_tokens);
    }
    // turns 카운터 갱신
    fetch("/info").then(r => r.json()).then(d => updateTurnsLabel(d.current_turns, d.max_history_turns));
  }

  // ── send dispatcher ──
  const RECEIPT_DELETE_RE = new RegExp(
    "잘못\\s*(올렸|저장|업로드)" +
    "|중복.*올렸|올렸.*중복|중복.*저장|중복.*됐|중복이야" +
    "|삭제\\s*(하고|할|하려|해줘|해|하|해달|하자|할게|할래)" +
    "|(영수증|구매).*(삭제|지우|없애)" +
    "|(삭제|지우|없애).*(영수증|구매)"
  );

  const RECEIPT_RENDER_RE = new RegExp(
    "렌더링|시각화" +
    "|카드\\s*(뉴스|이미지|형태|로\\s*(보여|만들|정리|해))" +
    "|이미지로\\s*(보여|만들)" +
    "|예쁘게\\s*(보여|정리|만들|요약|표현|해)" +
    "|보기좋게|이쁘게" +
    "|카드로?\\s*(보여|만들|정리|요약)" +
    "|(영수증|구매)\\s*.*(보여|정리|카드|요약|시각)"
  );

  async function send() {
    if (streaming) return;
    if (pendingImage) {
      await sendImage();
    } else {
      const msg = inputEl.value.trim();
      if (!msg) return;
      if (RECEIPT_DELETE_RE.test(msg)) {
        await showReceiptDeleteUI(msg);
      } else if (RECEIPT_RENDER_RE.test(msg)) {
        await showReceiptCards(msg);
      } else {
        await sendText(msg);
      }
    }
  }

  // ── text chat ──
  async function sendText(msg) {
    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addBubble("user", msg);
    const { row: aRow, bubble: aBubble } = addBubble("assistant");
    aBubble.classList.add("streaming", "typing-cursor");

    try {
      await sendStreaming(msg, aRow, aBubble);
    } catch {
      aBubble.textContent = "";
      try {
        await sendFallback(msg, aRow, aBubble);
      } catch (err) {
        aBubble.classList.remove("streaming", "typing-cursor");
        aBubble.textContent = `오류: ${err.message}`;
      }
    }

    aBubble.classList.remove("streaming", "typing-cursor");
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  async function sendStreaming(msg, aRow, aBubble) {
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, session_id: SESSION_ID, user_id: USER_CODE }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", rawText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));
        if (payload.token !== undefined) {
          rawText += payload.token;
          aBubble.textContent = rawText;
          chatWrap.scrollTop = chatWrap.scrollHeight;
        }
        if (payload.done) {
          renderMarkdown(aBubble, rawText);
          chatWrap.scrollTop = chatWrap.scrollHeight;
          appendUsageTag(aRow, payload.usage);
        }
      }
    }
    renderMarkdown(aBubble, rawText);
  }

  async function sendFallback(msg, aRow, aBubble) {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, session_id: SESSION_ID, user_id: USER_CODE }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderMarkdown(aBubble, data.reply);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    appendUsageTag(aRow, data.usage);
  }

  // ── image analysis ──
  async function sendImage() {
    const file = pendingImage;
    const prompt = inputEl.value.trim() || "이 이미지를 자세히 분석해주세요.";

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";
    clearImage();

    // user bubble: 이미지 썸네일 + 프롬프트
    const { row: uRow, bubble: uBubble } = addBubble("user");
    const thumb = document.createElement("img");
    thumb.src = URL.createObjectURL(file);
    thumb.className = "bubble-img";
    uBubble.appendChild(thumb);
    if (prompt !== "이 이미지를 자세히 분석해주세요.") {
      const txt = document.createElement("div");
      txt.textContent = prompt;
      uBubble.appendChild(txt);
    }

    // assistant bubble: 분석 결과
    const { row: aRow, bubble: aBubble } = addBubble("assistant");
    aBubble.classList.add("streaming", "typing-cursor");
    aBubble.textContent = "이미지 분석 중…";

    try {
      const formData = new FormData();
      formData.append("image", file);
      formData.append("prompt", prompt);
      formData.append("session_id", SESSION_ID);

      const resp = await fetch("/analyze", { method: "POST", body: formData });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();

      renderMarkdown(aBubble, data.analysis);
      chatWrap.scrollTop = chatWrap.scrollHeight;
      appendUsageTag(aRow, data.usage);

      if (data.saved_id) {
        const badge = document.createElement("div");
        badge.className = "saved-badge";
        badge.textContent = `✓ DB 저장 완료 (id: ${data.saved_id})`;
        aRow.appendChild(badge);
      }
    } catch (err) {
      aBubble.classList.remove("streaming", "typing-cursor");
      aBubble.textContent = `오류: ${err.message}`;
    }

    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // ── reset ──
  async function resetChat() {
    if (!confirm("대화 기록을 초기화할까요?")) return;
    await fetch("/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    chatWrap.innerHTML = "";
    clearImage();
    await loadInfo();
  }

  // ── receipt card helpers (모듈 스코프, grocery_saved + showReceiptCards 공유) ──
  function _rcptFmt(n) {
    if (n == null) return "—";
    const s = Math.abs(n).toLocaleString("ko-KR") + "원";
    return n < 0 ? "−" + s : s;
  }
  function _rcptEsc(s) {
    return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function _groupByMerchant(receipts) {
    const map = {}, order = [];
    receipts.forEach(r => {
      const key = r.merchant || "알 수 없음";
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(r);
    });
    return order.map(k => ({ merchant: k, receipts: map[k] }));
  }
  function _buildMerchantCard(merchant, receipts) {
    const MAX = 5;
    const multiVisit = receipts.length > 1;
    const grandTotal = receipts.reduce((sum, r) => sum + (r.total || 0), 0);

    const card = document.createElement("div");
    card.className = "receipt-report-card";
    const headerDate = multiVisit
      ? `${receipts.length}회 방문`
      : (receipts[0].purchase_date || "날짜 미상") + (receipts[0]._date_inferred ? " *" : "");
    card.innerHTML = `<div class="rrc-header">
        <span class="rrc-merchant">🏪 ${_rcptEsc(merchant)}</span>
        <span class="rrc-date">${_rcptEsc(headerDate)}</span>
      </div>`;

    receipts.forEach((r, idx) => {
      const allItems  = r.items || [];
      const purchase  = allItems.filter(i => !i.is_cancelled && i.amount != null && i.amount > 0);
      const discounts = allItems.filter(i => !i.is_cancelled && i.amount != null && i.amount < 0);
      const discTotal = discounts.reduce((s,i) => s+i.amount, 0);
      const visitTotal = r.total != null ? r.total
        : allItems.filter(i => !i.is_cancelled && i.amount != null).reduce((s,i) => s+i.amount, 0);

      if (multiVisit) {
        const sh = document.createElement("div");
        sh.className = "rrc-sub-header";
        sh.textContent = (r.purchase_date || `방문 ${idx+1}`) + (r._date_inferred ? " *" : "");
        card.appendChild(sh);
      }
      const itemsDiv = document.createElement("div");
      itemsDiv.className = "rrc-items";
      purchase.slice(0, MAX).forEach(i => {
        const row = document.createElement("div");
        row.className = "rrc-item";
        row.innerHTML = `<span>${_rcptEsc(i.raw_name)}</span><span>${_rcptFmt(i.amount)}</span>`;
        itemsDiv.appendChild(row);
      });
      if (purchase.length > MAX) {
        const more = document.createElement("div");
        more.className = "rrc-item more";
        more.innerHTML = `<span>외 ${purchase.length - MAX}개 품목</span><span></span>`;
        itemsDiv.appendChild(more);
      }
      if (discTotal < 0) {
        const disc = document.createElement("div");
        disc.className = "rrc-item discount";
        disc.innerHTML = `<span>↳ 할인</span><span>${_rcptFmt(discTotal)}</span>`;
        itemsDiv.appendChild(disc);
      }
      card.appendChild(itemsDiv);
      if (multiVisit) {
        const st = document.createElement("div");
        st.className = "rrc-subtotal";
        st.innerHTML = `<span>소계</span><span>${_rcptFmt(visitTotal)}</span>`;
        card.appendChild(st);
      }
    });

    const tot = document.createElement("div");
    tot.className = "rrc-total";
    tot.innerHTML = `<span>${multiVisit ? "총합계" : "합계"}</span><span>${_rcptFmt(grandTotal)}</span>`;
    card.appendChild(tot);
    return card;
  }
  function renderReceiptsIntoChat(receipts, label) {
    const groups = _groupByMerchant(receipts);
    const block = document.createElement("div");
    block.className = "receipt-report-block";
    const lbl = document.createElement("p");
    lbl.className = "receipt-report-label";
    lbl.textContent = label || (groups.length < receipts.length
      ? `🧾 저장된 영수증 ${receipts.length}장 · ${groups.length}개 업체`
      : `🧾 저장된 영수증 ${receipts.length}장`);
    block.appendChild(lbl);
    groups.forEach(g => block.appendChild(_buildMerchantCard(g.merchant, g.receipts)));
    chatWrap.appendChild(block);
    chatWrap.scrollTop = chatWrap.scrollHeight;
  }

            const label = `${r.merchant || "알 수 없음"} · ${r.purchase_date || "날짜 미상"}${totalStr}`;

                assistant_note: `영수증 #${r.id} (${label})이 삭제됐어요. 이제 구매 이력에서 제외됩니다.`,
              }),
            }).catch(() => {});
          } else {

            delBtn.textContent = "🗑 삭제";
          }
        } catch {
          delBtn.disabled = false;
          delBtn.textContent = "🗑 삭제";
        }
      });

      card.appendChild(idBadge);
      card.appendChild(info);
      card.appendChild(delBtn);

  // ── receipt history panel ──
  let _historyDeleteMode    = false;

  document.getElementById("history-close-btn").addEventListener("click", () => {
    document.getElementById("history-overlay").classList.remove("open");
  });

  function _updateDeleteHeader() {
    const selAll  = document.getElementById("history-sel-all");
    const confirm = document.getElementById("history-del-confirm");
    const list    = document.getElementById("history-list");
    const total   = list.querySelectorAll(".hrc").length;
    const checked = _historySelected.size;
    confirm.textContent = `선택 삭제 (${checked})`;
    confirm.classList.toggle("visible", checked > 0);
    selAll.classList.toggle("visible", _historyDeleteMode);
    const allSelected = total > 0 && checked === total;
    selAll.textContent = allSelected ? "전체 해제" : "전체 선택";
    selAll.classList.toggle("all-selected", allSelected);

  document.getElementById("history-del-toggle").addEventListener("click", () => {
    _historyDeleteMode = !_historyDeleteMode;
    _historySelected.clear();
    _historySelectedData.clear();
    const toggle = document.getElementById("history-del-toggle");
    const list   = document.getElementById("history-list");
    toggle.classList.toggle("active", _historyDeleteMode);
    toggle.textContent = _historyDeleteMode ? "취소" : "🗑 삭제";
    list.classList.toggle("delete-mode", _historyDeleteMode);
    list.querySelectorAll(".hrc").forEach(c => c.classList.remove("checked"));

  document.getElementById("history-sel-all").addEventListener("click", () => {
    const list  = document.getElementById("history-list");
    const cards = [...list.querySelectorAll(".hrc")];
    const total = cards.length;
    const allSelected = _historySelected.size === total;
    _historySelected.clear();
    _historySelectedData.clear();
    if (!allSelected) {
      cards.forEach(card => {
        const id = parseInt(card.dataset.id);
        _historySelected.add(id);
        // data-* 속성에서 복원
        _historySelectedData.set(id, {
          merchant:      card.dataset.merchant || null,
          purchase_date: card.dataset.date     || null,
          total:         card.dataset.total != null ? parseInt(card.dataset.total) : null,
        });
        card.classList.add("checked");
      });
    } else {
      cards.forEach(c => c.classList.remove("checked"));
    }
    _updateDeleteHeader();
  });

  function _renderFilterBar(rows) {
    const bar = document.getElementById("history-filter-bar");
    if (!rows || rows.length === 0) { bar.style.display = "none"; return; }

    // gather merchants
    const merchants = ["전체", ...new Set(rows.map(r => r.merchant || "알 수 없음"))];
    let activeMerchant = "전체";

    const chipsEl = document.createElement("div");
    chipsEl.className = "history-filter-chips";
    const statEl = document.createElement("div");
    statEl.className = "history-filter-stat";

    function updateStat(m) {
      const filtered = m === "전체" ? rows : rows.filter(r => (r.merchant || "알 수 없음") === m);
      const total = filtered.reduce((s, r) => s + (r.total || 0), 0);
      const count = filtered.length;
      statEl.innerHTML = `<strong>${count}건</strong> · 합계 <strong>${total.toLocaleString("ko-KR")}원</strong>`;
    }

    function applyFilter(m) {
      activeMerchant = m;
      chipsEl.querySelectorAll(".hfc").forEach(c => c.classList.toggle("active", c.dataset.m === m));
      updateStat(m);
      const list = document.getElementById("history-list");
      list.querySelectorAll(".hrc").forEach(card => {
        const cm = card.dataset.merchant || "알 수 없음";
        card.style.display = (m === "전체" || cm === m) ? "" : "none";
      });
    }

    merchants.forEach(m => {
      const btn = document.createElement("button");
      btn.className = "hfc" + (m === "전체" ? " active" : "");
      btn.dataset.m = m;
      btn.textContent = m;
      btn.addEventListener("click", () => applyFilter(m));
      chipsEl.appendChild(btn);
    });

    bar.innerHTML = "";
    bar.appendChild(chipsEl);
    bar.appendChild(statEl);
    bar.style.display = "flex";
    updateStat("전체");
  }

  async function openWeeklyPanel() {
    document.getElementById("weekly-overlay").classList.add("open");
    const content = document.getElementById("weekly-content");
    content.innerHTML = '<p class="week-empty">불러오는 중…</p>';
    const headerText = document.querySelector(".weekly-title");
    headerText.textContent = "📅 주간 지출 (불러오는 중…)";
    try {
      const rows = await fetch(`/grocery/history?days=35&user_id=${encodeURIComponent(USER_CODE)}`).then(r => r.json());
      content.innerHTML = "";
      if (!rows || rows.length === 0) {
        content.innerHTML = '<p class="week-empty">최근 5주간 저장된 영수증이 없어요.<br>영수증 분석기에서 영수증을 추가해보세요 🧾</p>';
        return;
      }

      // group by week (Monday-based)
      function weekMonday(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        const day = d.getDay(); // 0=Sun
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        return d.toISOString().slice(0, 10);
      }

      const weekMap = new Map();
      rows.forEach(r => {
        if (!r.purchase_date || !r.total) return;
        const wk = weekMonday(r.purchase_date);
        if (!weekMap.has(wk)) weekMap.set(wk, { total: 0, receipts: [] });
        const entry = weekMap.get(wk);
        entry.total += r.total;
        entry.receipts.push(r);
      });

      // sort weeks descending
      const weeks = [...weekMap.entries()].sort((a, b) => b[0].localeCompare(a[0]));
      const maxTotal = Math.max(...weeks.map(([, v]) => v.total));

      const totalSpent = weeks.reduce((s, [, { total }]) => s + total, 0);
      const endDate = new Date();
      const startDate = new Date(endDate);
      startDate.setDate(startDate.getDate() - 30);
      const monthLabel = `${startDate.getMonth() + 1}/${startDate.getDate()} ~ ${endDate.getMonth() + 1}/${endDate.getDate()}`;

      const fmtDate = s => {
        const d = new Date(s + "T00:00:00");
        return `${d.getMonth() + 1}/${d.getDate()}`;
      };
      const fmtAmt = n => n.toLocaleString("ko-KR") + "원";

      const headerText = document.querySelector(".weekly-title");
      headerText.textContent = `📅 주간 지출 (${monthLabel}: ${totalSpent.toLocaleString("ko-KR")}원)`;

      weeks.forEach(([monday, { total, receipts }], idx) => {
        const endDate = new Date(monday + "T00:00:00");
        endDate.setDate(endDate.getDate() + 6);
        const endStr = endDate.toISOString().slice(0, 10);

        const now = new Date();
        const thisMonday = weekMonday(now.toISOString().slice(0, 10));

        // simpler label
        let weekLabel;
        if (monday === thisMonday) weekLabel = `이번 주 (${fmtDate(monday)} ~ ${fmtDate(endStr)})`;
        else if (idx === 0 && monday !== thisMonday) weekLabel = `저번 주 (${fmtDate(monday)} ~ ${fmtDate(endStr)})`;
        else weekLabel = `${fmtDate(monday)} ~ ${fmtDate(endStr)}`;

        // merchant breakdown
        const merchantMap = new Map();
        receipts.forEach(r => {
          const m = r.merchant || "알 수 없음";
          merchantMap.set(m, (merchantMap.get(m) || 0) + (r.total || 0));
        });
        const topMerchants = [...merchantMap.entries()].sort((a, b) => b[1] - a[1]);

        const card = document.createElement("div");
        card.className = "week-card";
        const pct = maxTotal > 0 ? Math.round((total / maxTotal) * 100) : 0;

        card.innerHTML = `
          <div class="week-card-header">
            <span class="week-label">${weekLabel}</span>
            <span class="week-total">${fmtAmt(total)}</span>
          </div>
          <div class="week-bar-bg"><div class="week-bar-fill" style="width:${pct}%"></div></div>
          <div class="week-merchants">
            ${topMerchants.map(([m, t]) => `
              <div class="week-merchant-row">
                <span class="week-merchant-name">${m}</span>
                <span>${fmtAmt(t)}</span>
              </div>`).join("")}
          </div>
        `;
        content.appendChild(card);
      });
    } catch (err) {
      content.innerHTML = `<p class="week-empty">오류: ${err.message}</p>`;
    }
  }

  function _buildHistoryCard(r) {
    const fmtAmt = n => n != null ? Math.abs(n).toLocaleString("ko-KR") + "원" : "—";

    const card = document.createElement("div");
    card.className = "hrc";
    card.dataset.id       = r.id;
    card.dataset.merchant = r.merchant     || "";
    card.dataset.date     = r.purchase_date || "";
    if (r.total != null) card.dataset.total = r.total;

    const row = document.createElement("div");
    row.className = "hrc-row";

    const check = document.createElement("div");
    check.className = "hrc-check";
    check.textContent = "✓";

    const icon = document.createElement("div");
    icon.className = "hrc-icon";
    icon.textContent = r.is_refund ? "↩" : "🧾";

    const body = document.createElement("div");
    body.className = "hrc-body";
    const merchantDiv = document.createElement("div");
    merchantDiv.className = "hrc-merchant";
    merchantDiv.textContent = r.merchant || "알 수 없음";
    const metaDiv = document.createElement("div");
    metaDiv.className = "hrc-meta";
    metaDiv.textContent = `${r.purchase_date || "날짜 미상"} · ${r.item_count ?? 0}개 품목`;
    body.appendChild(merchantDiv);
    body.appendChild(metaDiv);

    const right = document.createElement("div");
    right.className = "hrc-right";
    const amountDiv = document.createElement("div");
    amountDiv.className = "hrc-amount";
    amountDiv.textContent = fmtAmt(r.total);
    const arrow = document.createElement("div");
    arrow.className = "hrc-expand";
    arrow.textContent = "▼";
    right.appendChild(amountDiv);
    right.appendChild(arrow);

    row.appendChild(check);
    row.appendChild(icon);
    row.appendChild(body);

    const editBtn = document.createElement("button");
    editBtn.className = "hrc-edit-btn";
    editBtn.textContent = "수정";
    editBtn.addEventListener("click", e => {
      e.stopPropagation();
      openEditModal(r.id, r.merchant || "", r.purchase_date || "");
    });
    right.appendChild(editBtn);

    row.appendChild(right);

    const detail = document.createElement("div");
    detail.className = "hrc-detail";

    card.appendChild(row);
    card.appendChild(detail);

    // 화살표 클릭: 삭제 모드와 무관하게 항상 상세 펼치기/접기
    arrow.addEventListener("click", e => {
      e.stopPropagation();
      const isExpanded = card.classList.contains("expanded");
      card.classList.toggle("expanded");
      if (!isExpanded && !detail.dataset.loaded) {
        _loadReceiptDetail(r.id, detail);
      }
      if (card.classList.contains("expanded")) {
        const detailEl = card.querySelector(".hrc-detail");
        setTimeout(() => {
          detailEl.style.maxHeight = (detailEl.scrollHeight + 20) + "px";
          card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 50);
      } else {
        const detailEl = card.querySelector(".hrc-detail");
        detailEl.style.maxHeight = "0";
      }
    });

    row.addEventListener("click", () => {
      if (_historyDeleteMode) {
        const id = parseInt(card.dataset.id);
        if (_historySelected.has(id)) {
          _historySelected.delete(id);
          _historySelectedData.delete(id);
          card.classList.remove("checked");
        } else {
          _historySelected.add(id);
          _historySelectedData.set(id, { merchant: r.merchant, purchase_date: r.purchase_date, total: r.total });
          card.classList.add("checked");
        }
        _updateDeleteHeader();
      } else {
        const isExpanded = card.classList.contains("expanded");
        card.classList.toggle("expanded");
        if (!isExpanded && !detail.dataset.loaded) {
          _loadReceiptDetail(r.id, detail);
        }
        if (card.classList.contains("expanded")) {
          const detailEl = card.querySelector(".hrc-detail");
          setTimeout(() => {
            detailEl.style.maxHeight = (detailEl.scrollHeight + 20) + "px";
            card.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }, 50);
        } else {
          const detailEl = card.querySelector(".hrc-detail");
          detailEl.style.maxHeight = "0";
        }
      }
    });

    return card;
  }

  async function _loadReceiptDetail(receiptId, detailEl) {
    detailEl.innerHTML = '<p style="font-size:0.8rem;color:#aaa;padding:4px 0">불러오는 중…</p>';
    try {
      const data = await fetch(
        `/grocery/receipt/${receiptId}?user_id=${encodeURIComponent(USER_CODE)}`
      ).then(r => r.json());
      detailEl.innerHTML = "";
      detailEl.dataset.loaded = "1";
      _renderReceiptDetail(data, detailEl);
    } catch (err) {
      detailEl.innerHTML = `<p style="font-size:0.8rem;color:#dc2626">오류: ${err.message}</p>`;
    }
  }

  function _renderReceiptDetail(data, el) {
    const fmt = n => {
      if (n == null) return "—";
      const s = Math.abs(n).toLocaleString("ko-KR") + "원";
      return n < 0 ? "−" + s : s;
    };
    const items = data.items || [];
    const table = document.createElement("table");
    table.className = "hrc-items-table";
    items.forEach(item => {
      const tr = document.createElement("tr");
      if (item.is_cancelled) tr.className = "cancelled";
      else if ((item.amount || 0) < 0) tr.className = "discount";
      tr.innerHTML = `
        <td>${item.raw_name || "—"}</td>
        <td style="text-align:center;color:#bbb;width:28px">${(item.qty || 1) > 1 ? item.qty : ""}</td>
        <td>${fmt(item.amount)}</td>
      `;
      table.appendChild(tr);
    });
    el.appendChild(table);
    if (data.total != null) {
      const totalRow = document.createElement("div");
      totalRow.className = "hrc-total-row";
      totalRow.innerHTML = `<span>합계</span><span>${fmt(data.total)}</span>`;
      el.appendChild(totalRow);
    }
    if (data.created_at) {
      const createdDiv = document.createElement("div");
      createdDiv.style.cssText = "font-size:0.7rem;color:#bbb;margin-top:8px;text-align:right";
      createdDiv.textContent = `저장: ${data.created_at.substring(0, 16).replace("T", " ")}`;
      el.appendChild(createdDiv);
    }
  }

  loadInfo();

  // ── grocery_saved 자동 요약 ──
  const _params = new URLSearchParams(window.location.search);
  if (_params.get("grocery_saved")) {
    history.replaceState({}, "", "/");

    // 구/신 포맷 모두 지원
    let _receipts = [];
    try {
      const _raw = sessionStorage.getItem("pendingReceipts") || sessionStorage.getItem("pendingReceipt");
      if (_raw) {
        const _parsed = JSON.parse(_raw);
        _receipts = Array.isArray(_parsed) ? _parsed : [_parsed];
      }
    } catch(e) {}
    sessionStorage.removeItem("pendingReceipts");
    sessionStorage.removeItem("pendingReceipt");

    setTimeout(() => {
      // 공유 헬퍼(_groupByMerchant, _buildMerchantCard, renderReceiptsIntoChat) 사용
      if (_receipts.length > 0) {
        renderReceiptsIntoChat(_receipts);
      }

      // LLM에 보낼 메시지 (인라인 데이터 포함)
      const _summary = _receipts.map(r => {
        const items = (r.items||[]).filter(i=>!i.is_cancelled && i.amount != null && i.amount > 0);
        const discounts = (r.items||[]).filter(i=>!i.is_cancelled && i.amount != null && i.amount < 0);
        const discTotal = discounts.reduce((s,i)=>s+i.amount,0);
        const lines = items.map(i=>`  - ${i.raw_name}: ${(i.amount||0).toLocaleString("ko-KR")}원`).join("\n");
        const discLine = discTotal<0 ? `\n  할인: ${discTotal.toLocaleString("ko-KR")}원` : "";
        const totalLine = r.total ? `\n  합계: ${r.total.toLocaleString("ko-KR")}원` : "";
        return `[${r.merchant||"알 수 없음"} · ${r.purchase_date||"날짜 미상"}]\n${lines}${discLine}${totalLine}`;
      }).join("\n\n");

      const msg = `[방금 저장한 영수증]\n${_summary}\n\n이 구매 내역을 보기 좋게 요약하고, 장보기 패턴과 다음에 사면 좋을 것들을 추천해줘.`;
      sendText(msg);
    }, 400);
  }
</script>
