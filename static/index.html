<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure OpenAI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #1a1a1a; }

    #info-bar {
      font-size: 0.75rem;
      color: #666;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    #info-bar span { white-space: nowrap; }

    #reset-btn {
      padding: 5px 12px;
      font-size: 0.75rem;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      color: #555;
    }
    #reset-btn:hover { background: #f5f5f5; }

    #chat-wrap {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .bubble-row.user { align-self: flex-end; align-items: flex-end; }
    .bubble-row.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user .bubble {
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .usage-tag {
      font-size: 0.68rem;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    .typing-cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    footer {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.9rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      background: transparent;
    }

    #send-btn {
      align-self: flex-end;
      padding: 7px 16px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #106ebe; }
    #send-btn:disabled { background: #b0c8e8; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Azure OpenAI Chat</h1>
  <div id="info-bar">
    <span id="deployment-label">—</span>
    <span id="rate-label">—</span>
    <span id="cost-label">누적: —</span>
  </div>
  <button id="reset-btn">대화 초기화</button>
</header>

<div id="chat-wrap"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요…"></textarea>
    <button id="send-btn">전송</button>
  </div>
</footer>

<script>
  const chatWrap = document.getElementById("chat-wrap");
  const inputEl  = document.getElementById("input");
  const sendBtn  = document.getElementById("send-btn");

  let streaming = false;

  // ── auto-grow textarea ──
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  // ── Enter to send (Shift+Enter = newline) ──
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);
  document.getElementById("reset-btn").addEventListener("click", resetChat);

  // ── load info on start ──
  async function loadInfo() {
    const r = await fetch("/info");
    const d = await r.json();
    document.getElementById("deployment-label").textContent = `모델: ${d.deployment}`;
    document.getElementById("rate-label").textContent = `환율: 1 USD = ₩${d.usd_to_krw.toLocaleString("ko-KR", {maximumFractionDigits:1})} (${d.rate_date})`;
    updateCostLabel(d.total_cost_usd, d.total_cost_krw, d.total_tokens);
  }

  function updateCostLabel(usd, krw, tokens) {
    document.getElementById("cost-label").textContent =
      `누적: $${usd.toFixed(6)} (₩${krw.toLocaleString("ko-KR", {minimumFractionDigits:2, maximumFractionDigits:2})}) · ${tokens} tokens`;
  }

  function addBubble(role, text = "") {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return { row, bubble };
  }

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addBubble("user", msg);

    const { row: aRow, bubble: aBubble } = addBubble("assistant");
    aBubble.classList.add("typing-cursor");

    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));

        if (payload.token !== undefined) {
          aBubble.textContent += payload.token;
          chatWrap.scrollTop = chatWrap.scrollHeight;
        }

        if (payload.done) {
          aBubble.classList.remove("typing-cursor");
          const u = payload.usage;
          const tag = document.createElement("div");
          tag.className = "usage-tag";
          tag.textContent =
            `${u.prompt_tokens} in / ${u.completion_tokens} out · ` +
            `$${u.turn_cost_usd.toFixed(6)} (₩${u.turn_cost_krw.toLocaleString("ko-KR", {minimumFractionDigits:2, maximumFractionDigits:2})})`;
          aRow.appendChild(tag);
          updateCostLabel(u.total_cost_usd, u.total_cost_krw, u.total_tokens);
        }
      }
    }

    aBubble.classList.remove("typing-cursor");
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  async function resetChat() {
    if (!confirm("대화 기록을 초기화할까요?")) return;
    await fetch("/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) });
    chatWrap.innerHTML = "";
    await loadInfo();
  }

  loadInfo();
</script>
</body>
</html>
