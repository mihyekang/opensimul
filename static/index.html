<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure OpenAI Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1rem; font-weight: 600; color: #1a1a1a; }

    #info-bar {
      font-size: 0.75rem;
      color: #666;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    #info-bar span { white-space: nowrap; }

    #reset-btn {
      padding: 5px 12px;
      font-size: 0.75rem;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      color: #555;
    }
    #reset-btn:hover { background: #f5f5f5; }

    #chat-wrap {
      width: 100%;
      max-width: 800px;
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }
    .bubble-row.user  { align-self: flex-end;   align-items: flex-end; }
    .bubble-row.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
      word-break: break-word;
    }

    /* user bubble — plain text */
    .user .bubble {
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }

    /* assistant bubble — markdown host */
    .assistant .bubble {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    /* streaming: plain text with cursor */
    .assistant .bubble.streaming {
      white-space: pre-wrap;
    }

    /* ── markdown styles ── */
    .assistant .bubble h1,
    .assistant .bubble h2,
    .assistant .bubble h3,
    .assistant .bubble h4 {
      margin: 0.9em 0 0.4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .assistant .bubble h1 { font-size: 1.25em; }
    .assistant .bubble h2 { font-size: 1.1em; }
    .assistant .bubble h3 { font-size: 1em; }

    .assistant .bubble p { margin: 0.5em 0; }
    .assistant .bubble p:first-child { margin-top: 0; }
    .assistant .bubble p:last-child  { margin-bottom: 0; }

    .assistant .bubble ul,
    .assistant .bubble ol {
      margin: 0.5em 0 0.5em 1.4em;
    }
    .assistant .bubble li { margin: 0.2em 0; }

    .assistant .bubble blockquote {
      border-left: 3px solid #0078d4;
      margin: 0.6em 0;
      padding: 4px 12px;
      color: #555;
      background: #f7f9fc;
      border-radius: 0 6px 6px 0;
    }

    .assistant .bubble a { color: #0078d4; text-decoration: underline; }

    .assistant .bubble code {
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85em;
    }

    .assistant .bubble pre {
      margin: 0.6em 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .assistant .bubble pre code {
      display: block;
      padding: 12px 14px;
      overflow-x: auto;
      background: #f6f8fa;
      border: none;
      border-radius: 0;
      font-size: 0.83em;
      line-height: 1.55;
    }

    .assistant .bubble table {
      border-collapse: collapse;
      margin: 0.6em 0;
      font-size: 0.85em;
      width: 100%;
    }
    .assistant .bubble th,
    .assistant .bubble td {
      border: 1px solid #dde1e7;
      padding: 6px 10px;
      text-align: left;
    }
    .assistant .bubble th { background: #f3f4f6; font-weight: 600; }
    .assistant .bubble tr:nth-child(even) td { background: #fafafa; }

    .assistant .bubble hr {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 0.8em 0;
    }

    /* ── typing cursor ── */
    .typing-cursor::after {
      content: "▋";
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .usage-tag {
      font-size: 0.68rem;
      color: #999;
      margin-top: 4px;
      padding: 0 4px;
    }

    footer {
      width: 100%;
      max-width: 800px;
      padding: 12px 16px 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 8px 8px 8px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 0.9rem;
      font-family: inherit;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      background: transparent;
    }

    #send-btn {
      align-self: flex-end;
      padding: 7px 16px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #106ebe; }
    #send-btn:disabled { background: #b0c8e8; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Azure OpenAI Chat</h1>
  <div id="info-bar">
    <span id="deployment-label">—</span>
    <span id="rate-label">—</span>
    <span id="cost-label">누적: —</span>
  </div>
  <button id="reset-btn">대화 초기화</button>
</header>

<div id="chat-wrap"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="메시지를 입력하세요…"></textarea>
    <button id="send-btn">전송</button>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // configure marked: use highlight.js for fenced code blocks
  marked.setOptions({
    highlight: (code, lang) => {
      const language = hljs.getLanguage(lang) ? lang : "plaintext";
      return hljs.highlight(code, { language }).value;
    },
    breaks: true,   // single newline → <br>
    gfm: true,
  });

  const chatWrap = document.getElementById("chat-wrap");
  const inputEl  = document.getElementById("input");
  const sendBtn  = document.getElementById("send-btn");

  let streaming = false;

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);
  document.getElementById("reset-btn").addEventListener("click", resetChat);

  async function loadInfo() {
    const r = await fetch("/info");
    const d = await r.json();
    document.getElementById("deployment-label").textContent = `모델: ${d.deployment}`;
    document.getElementById("rate-label").textContent =
      `환율: 1 USD = ₩${d.usd_to_krw.toLocaleString("ko-KR", { maximumFractionDigits: 1 })} (${d.rate_date})`;
    updateCostLabel(d.total_cost_usd, d.total_cost_krw, d.total_tokens);
  }

  function updateCostLabel(usd, krw, tokens) {
    document.getElementById("cost-label").textContent =
      `누적: $${usd.toFixed(6)} (₩${krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}) · ${tokens} tokens`;
  }

  function addBubble(role, text = "") {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "user") {
      bubble.textContent = text;
    }
    row.appendChild(bubble);
    chatWrap.appendChild(row);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    return { row, bubble };
  }

  function renderMarkdown(bubble, raw) {
    bubble.classList.remove("streaming", "typing-cursor");
    bubble.innerHTML = marked.parse(raw);
    // apply highlight.js to any code blocks that marked didn't auto-highlight
    bubble.querySelectorAll("pre code:not(.hljs)").forEach(el => hljs.highlightElement(el));
  }

  function appendUsageTag(row, u) {
    const tag = document.createElement("div");
    tag.className = "usage-tag";
    tag.textContent =
      `${u.prompt_tokens} in / ${u.completion_tokens} out · ` +
      `$${u.turn_cost_usd.toFixed(6)} (₩${u.turn_cost_krw.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })})`;
    row.appendChild(tag);
    updateCostLabel(u.total_cost_usd, u.total_cost_krw, u.total_tokens);
  }

  async function sendStreaming(msg, aRow, aBubble) {
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let rawText = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = JSON.parse(line.slice(6));

        if (payload.token !== undefined) {
          rawText += payload.token;
          aBubble.textContent = rawText;
          chatWrap.scrollTop = chatWrap.scrollHeight;
        }

        if (payload.done) {
          renderMarkdown(aBubble, rawText);
          chatWrap.scrollTop = chatWrap.scrollHeight;
          appendUsageTag(aRow, payload.usage);
        }
      }
    }

    renderMarkdown(aBubble, rawText);
  }

  async function sendFallback(msg, aRow, aBubble) {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    renderMarkdown(aBubble, data.reply);
    chatWrap.scrollTop = chatWrap.scrollHeight;
    appendUsageTag(aRow, data.usage);
  }

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg || streaming) return;

    streaming = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addBubble("user", msg);

    const { row: aRow, bubble: aBubble } = addBubble("assistant");
    aBubble.classList.add("streaming", "typing-cursor");

    try {
      await sendStreaming(msg, aRow, aBubble);
    } catch (streamErr) {
      // 프록시 차단 등으로 스트리밍 실패 → 비스트리밍 fallback
      aBubble.textContent = "";
      try {
        await sendFallback(msg, aRow, aBubble);
      } catch (err) {
        aBubble.classList.remove("streaming", "typing-cursor");
        aBubble.textContent = `오류: ${err.message}`;
      }
    }

    aBubble.classList.remove("streaming", "typing-cursor");
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  async function resetChat() {
    if (!confirm("대화 기록을 초기화할까요?")) return;
    await fetch("/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({}),
    });
    chatWrap.innerHTML = "";
    await loadInfo();
  }

  loadInfo();
</script>
</body>
</html>
