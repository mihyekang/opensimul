<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영수증 추출 테스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6f8;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 24px;
    }

    /* ── upload zone ── */
    #drop-zone {
      width: 100%;
      max-width: 480px;
      border: 2px dashed #c8cdd5;
      border-radius: 14px;
      background: #fff;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 20px;
    }
    #drop-zone.drag-over {
      border-color: #0078d4;
      background: #f0f7ff;
    }
    #drop-zone .icon { font-size: 2.2rem; margin-bottom: 10px; }
    #drop-zone p { font-size: 0.85rem; color: #666; line-height: 1.6; }
    #drop-zone strong { color: #0078d4; }
    #file-input { display: none; }

    /* ── thumbnail strip ── */
    #thumb-strip {
      display: none;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .thumb-item {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e0e0e0;
      background: #fff;
      flex-shrink: 0;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-item .thumb-remove {
      position: absolute;
      top: 3px; right: 3px;
      width: 18px; height: 18px;
      background: rgba(0,0,0,.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .thumb-item.processing { border-color: #0078d4; }
    .thumb-item.done { border-color: #22c55e; }
    .thumb-item.error { border-color: #ef4444; }

    /* add-more button inside strip */
    #add-more-btn {
      width: 88px;
      height: 88px;
      border-radius: 8px;
      border: 2px dashed #c8cdd5;
      background: #f8f9fa;
      color: #888;
      font-size: 1.6rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #add-more-btn:hover { border-color: #0078d4; color: #0078d4; }

    /* ── extract button ── */
    #extract-btn {
      width: 100%;
      max-width: 480px;
      padding: 13px;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 24px;
      transition: background 0.15s;
    }
    #extract-btn:hover:not(:disabled) { background: #106ebe; }
    #extract-btn:disabled { background: #b0c8e8; cursor: not-allowed; }

    /* ── progress ── */
    #progress-wrap {
      display: none;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
    }
    .progress-bar-bg {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    #progress-bar {
      height: 100%;
      background: #0078d4;
      border-radius: 3px;
      transition: width 0.3s;
      width: 0%;
    }
    #progress-text {
      font-size: 0.78rem;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ccc;
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── result cards ── */
    #result-wrap {
      display: none;
      width: 100%;
      max-width: 480px;
    }

    .result-section {
      margin-bottom: 28px;
    }
    .result-file-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 18px 16px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .merchant { font-size: 1rem; font-weight: 700; color: #111; }
    .date     { font-size: 0.78rem; color: #888; }
    .date.inferred { color: #aaa; font-style: italic; }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      margin-bottom: 12px;
    }
    .items-table th {
      text-align: left;
      color: #888;
      font-weight: 500;
      padding: 4px 6px 8px;
      border-bottom: 1px solid #f0f0f0;
    }
    .items-table td {
      padding: 6px 6px;
      border-bottom: 1px solid #f8f8f8;
      color: #333;
    }
    .items-table td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table td.qty { text-align: center; color: #888; }
    .items-table tr.unrecognized td { color: #bbb; }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid #e5e7eb;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .total-sub {
      font-size: 0.72rem;
      font-weight: 400;
      color: #aaa;
      margin-left: 6px;
    }

    /* issues */
    .issues {
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #7a5c00;
      margin-bottom: 12px;
    }
    .issues p { margin: 2px 0; }
    .issues.pass {
      background: #f0fdf4;
      border-color: #86efac;
      color: #166534;
    }

    /* refund badge */
    .badge-refund {
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* raw JSON toggle */
    .raw-toggle {
      font-size: 0.75rem;
      color: #0078d4;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-bottom: 6px;
    }
    .raw-json {
      display: none;
      background: #f6f8fa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.72rem;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: #333;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<h1>영수증 추출 테스트 — Pass 1</h1>
<p class="subtitle">이미지 업로드 → 품목 추출 → 검증 결과 확인</p>

<div id="drop-zone">
  <div class="icon">🧾</div>
  <p><strong>클릭</strong>하거나 이미지를 여기로 드래그하세요<br>
  여러 장 동시 선택 가능 · 이마트 · 쿠팡 · 네이버 영수증</p>
  <input type="file" id="file-input" accept="image/*" multiple />
</div>

<div id="thumb-strip"></div>

<button id="extract-btn" disabled>추출하기</button>

<div id="progress-wrap">
  <div class="progress-bar-bg"><div id="progress-bar"></div></div>
  <div id="progress-text"><span class="spinner"></span><span id="progress-label">처리 중…</span></div>
</div>

<div id="result-wrap"></div>

<script>
  const dropZone    = document.getElementById("drop-zone");
  const fileInput   = document.getElementById("file-input");
  const thumbStrip  = document.getElementById("thumb-strip");
  const extractBtn  = document.getElementById("extract-btn");
  const progressWrap= document.getElementById("progress-wrap");
  const progressBar = document.getElementById("progress-bar");
  const progressLabel = document.getElementById("progress-label");
  const resultWrap  = document.getElementById("result-wrap");

  let selectedFiles = []; // File objects

  // ── file selection ──
  dropZone.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    addFiles(Array.from(fileInput.files));
    fileInput.value = "";
  });

  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("drag-over");
    addFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/")));
  });

  function addFiles(files) {
    files.forEach(f => {
      if (!selectedFiles.find(x => x.name === f.name && x.size === f.size)) {
        selectedFiles.push(f);
      }
    });
    renderThumbs();
  }

  function renderThumbs() {
    if (!selectedFiles.length) {
      thumbStrip.style.display = "none";
      dropZone.style.display = "block";
      extractBtn.disabled = true;
      return;
    }

    dropZone.style.display = "none";
    thumbStrip.style.display = "flex";
    thumbStrip.innerHTML = "";

    selectedFiles.forEach((file, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "thumb-item";
      wrap.dataset.idx = idx;

      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);

      const rm = document.createElement("button");
      rm.className = "thumb-remove";
      rm.textContent = "✕";
      rm.addEventListener("click", () => {
        selectedFiles.splice(idx, 1);
        renderThumbs();
      });

      wrap.appendChild(img);
      wrap.appendChild(rm);
      thumbStrip.appendChild(wrap);
    });

    // add-more button
    const addBtn = document.createElement("button");
    addBtn.id = "add-more-btn";
    addBtn.textContent = "+";
    addBtn.addEventListener("click", () => fileInput.click());
    thumbStrip.appendChild(addBtn);

    extractBtn.disabled = false;
  }

  // ── extract ──
  extractBtn.addEventListener("click", async () => {
    if (!selectedFiles.length) return;

    extractBtn.disabled = true;
    progressWrap.style.display = "block";
    resultWrap.style.display = "none";
    resultWrap.innerHTML = "";

    const total = selectedFiles.length;
    const thumbItems = thumbStrip.querySelectorAll(".thumb-item");

    for (let i = 0; i < total; i++) {
      const file = selectedFiles[i];
      const pct = Math.round((i / total) * 100);
      progressBar.style.width = pct + "%";
      progressLabel.textContent = `${i + 1} / ${total} 처리 중… (${file.name})`;

      if (thumbItems[i]) thumbItems[i].classList.add("processing");

      try {
        const form = new FormData();
        form.append("image", file);
        const resp = await fetch("/grocery/extract", { method: "POST", body: form });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const section = buildResultSection(file.name, data);
        resultWrap.appendChild(section);
        if (thumbItems[i]) { thumbItems[i].classList.remove("processing"); thumbItems[i].classList.add("done"); }
      } catch (err) {
        const errDiv = document.createElement("div");
        errDiv.className = "result-section";
        errDiv.innerHTML = `<p class="result-file-label">${escHtml(file.name)}</p><div class="issues"><p>🔴 오류: ${escHtml(err.message)}</p></div>`;
        resultWrap.appendChild(errDiv);
        if (thumbItems[i]) { thumbItems[i].classList.remove("processing"); thumbItems[i].classList.add("error"); }
      }
    }

    progressBar.style.width = "100%";
    progressLabel.textContent = `완료 (${total}장)`;

    resultWrap.style.display = "block";
    resultWrap.scrollIntoView({ behavior: "smooth" });
    extractBtn.disabled = false;
  });

  // ── helpers ──
  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function fmt(n) {
    if (n == null) return "—";
    return Number(n).toLocaleString("ko-KR") + "원";
  }

  function buildResultSection(filename, { result, issues }) {
    const section = document.createElement("div");
    section.className = "result-section";

    // file label
    const label = document.createElement("p");
    label.className = "result-file-label";
    label.textContent = filename;
    section.appendChild(label);

    // issues box
    const issuesBox = document.createElement("div");
    issuesBox.className = "issues";
    if (issues && issues.length) {
      issuesBox.innerHTML = issues.map(i => `<p>${escHtml(i)}</p>`).join("");
    } else {
      issuesBox.innerHTML = "<p>✅ 검증 통과</p>";
      issuesBox.classList.add("pass");
    }
    section.appendChild(issuesBox);

    // card
    const card = document.createElement("div");
    card.className = "card";

    const dateText = result.purchase_date || "날짜 없음";
    const dateClass = result._date_inferred ? "date inferred" : "date";
    const dateTitle = result._date_inferred ? ' title="영수증에 날짜 없음 — 오늘 날짜 사용"' : '';

    card.innerHTML = `
      <div class="card-header">
        <span class="merchant">${escHtml(result.merchant || "—")}</span>
        <span>
          ${result.is_refund ? '<span class="badge-refund">환불</span>' : ''}
          <span class="${dateClass}"${dateTitle}>${escHtml(dateText)}${result._date_inferred ? ' *' : ''}</span>
        </span>
      </div>
      <table class="items-table">
        <thead><tr>
          <th>품목 (raw)</th>
          <th class="qty">수량</th>
          <th style="text-align:right">금액</th>
        </tr></thead>
        <tbody id="tbody-placeholder"></tbody>
      </table>
      <div class="total-row">
        <span>합계</span>
        <span id="total-placeholder"></span>
      </div>
    `;
    section.appendChild(card);

    // fill items
    const tbody = card.querySelector("#tbody-placeholder");
    tbody.removeAttribute("id");
    (result.items || []).forEach(item => {
      const tr = document.createElement("tr");
      const hasAmount = item.amount != null;
      if (!hasAmount) tr.className = "unrecognized";
      tr.innerHTML = `
        <td>${escHtml(item.raw_name || "—")}</td>
        <td class="qty">${item.qty ?? 1}</td>
        <td class="amount">${fmt(item.amount)}</td>
      `;
      tbody.appendChild(tr);
    });

    // fill total (only recognized items)
    const recognized = (result.items || []).filter(i => i.amount != null);
    const recognizedSum = recognized.reduce((s, i) => s + (i.amount || 0), 0);
    const totalEl = card.querySelector("#total-placeholder");
    totalEl.removeAttribute("id");
    const allRecognized = recognized.length === (result.items || []).length;
    totalEl.innerHTML = fmt(recognizedSum) +
      (!allRecognized ? `<span class="total-sub">(인식된 항목만)</span>` : "");

    // raw JSON toggle
    const toggle = document.createElement("button");
    toggle.className = "raw-toggle";
    toggle.textContent = "▶ JSON 원본 보기";
    const pre = document.createElement("pre");
    pre.className = "raw-json";
    pre.textContent = JSON.stringify(result, null, 2);
    toggle.addEventListener("click", () => {
      const open = pre.style.display === "block";
      pre.style.display = open ? "none" : "block";
      toggle.textContent = open ? "▶ JSON 원본 보기" : "▼ JSON 원본 닫기";
    });
    section.appendChild(toggle);
    section.appendChild(pre);

    return section;
  }
</script>
</body>
</html>
